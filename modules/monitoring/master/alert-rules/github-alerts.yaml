groups:
  # Alerts on the state of CI across the sdr-enthusiasts and fredsystems
  # organisations, sourced from github-ci-exporter on sdrhub.
  #
  # SCOPE
  #
  # These rules describe the health of the *default branch*. The exporter
  # already excludes pull-request runs, runs of deleted workflows, and runs
  # older than 90 days, so anything reaching these expressions is meant to
  # describe current code. See the exporter's README for why each of those
  # filters exists -- naively taking the newest run per workflow produced 38
  # "failures" of which fewer than half were real.
  #
  # BOT vs HUMAN
  #
  # The exporter labels issues and pull requests with author_kind, derived
  # from GraphQL's __typename rather than a login denylist. Rules that would
  # otherwise be dominated by renovate and dependabot select
  # author_kind="human". Bot activity stays on the dashboard for visibility.
  - name: github-ci
    rules:
      # The core signal. A workflow whose most recent branch-state run
      # failed.
      #
      # conclusion="failure" covers only genuine breakage: the exporter maps
      # cancelled and skipped to their own conclusions, because both are
      # routine (superseded pushes, path filters) and paging on them trains
      # the operator to ignore the alert. timed_out and action_required are
      # separate conclusions and are matched explicitly below.
      #
      # The 15m `for:` absorbs the retrigger window -- a push that fails and
      # is immediately fixed should not page.
      - alert: GitHubCIFailingDefaultBranch
        expr: |
          max by (org, repo, workflow) (
            github_workflow_run_status{conclusion=~"failure|timed_out|action_required"}
          ) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CI failing on {{ $labels.org }}/{{ $labels.repo }}"
          description: "Workflow {{ $labels.workflow }} last failed on the default branch of {{ $labels.org }}/{{ $labels.repo }}."

      # GitHub disables scheduled workflows in a repository with no activity
      # for 60 days, silently. The workflow simply stops running; nothing is
      # reported anywhere. This was live in the fleet on fredsystems/fred-cal,
      # where a weekly update-flakes had been dead long enough to be invisible.
      #
      # state="disabled_inactivity" only. A manual disable is deliberate and
      # must not page.
      - alert: GitHubWorkflowAutoDisabled
        expr: github_workflow_enabled{state="disabled_inactivity"} == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "GitHub auto-disabled {{ $labels.workflow }} in {{ $labels.org }}/{{ $labels.repo }}"
          description: "GitHub disabled this workflow after 60 days of repository inactivity. It is no longer running. Re-enable it in the Actions tab, or push to the repository."

      # A scheduled workflow that has missed its cadence. expected_interval is
      # derived from the workflow's own cron expression, so the threshold
      # adapts to weekly vs daily schedules rather than being a fixed guess.
      #
      # The slack term is purely ADDITIVE, with no multiplier at all. GitHub
      # delays scheduled runs by a roughly fixed amount that does not scale
      # with cadence: measured over 907 intervals across this fleet, lateness
      # is p90 36-90m and never exceeded 220m, and the 6-hourly cron showed
      # the WORST p90 of any cadence. A multiplier therefore misprices both
      # ends. The previous 3x gave a monthly cron 84 days of slack - long
      # enough for a dead workflow to stay invisible for a quarter - while
      # giving an hourly cron only 3 hours, which is less than GitHub's own
      # median delay for high-frequency schedules. That produced sustained
      # false positives on sdr-enthusiasts/docker-shipfeeder and no useful
      # coverage on the monthly crons.
      #
      # 4h was backtested against 60 days of real run history for every
      # scheduled workflow in the fleet: zero false positives, and it roughly
      # halves time-to-detection for a genuinely dead workflow (monthly
      # 84d -> 31d4h, weekly 21d -> 7d4h, daily 3d -> 28h, hourly 3h -> 5h).
      #
      # Note the margin is thin by construction: 4h is only ~20 minutes above
      # the worst lateness ever observed, and that worst case was a
      # correlated GitHub incident that delayed five unrelated repositories
      # at once. If this starts crying wolf, raise the constant rather than
      # reintroducing a multiplier - the multiplier is what was wrong.
      #
      # This threshold assumes the exporter reports the LONGEST legitimate gap
      # for a cron, not the first one. github-ci-exporter got that wrong until
      # f8f11a0: `0 0 1 * *` resolved to 28 days rather than 31, which made
      # every monthly workflow look permanently three days late.
      #
      # The `unless` guard suppresses this for workflows already known to be
      # disabled, which GitHubWorkflowAutoDisabled reports with a more
      # accurate description.
      - alert: GitHubScheduledWorkflowStale
        expr: |
          (
            time() - github_workflow_run_timestamp_seconds
              > github_workflow_expected_interval_seconds + (4 * 60 * 60)
          )
          unless on (org, repo, workflow) (
            github_workflow_enabled == 0
          )
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Scheduled workflow {{ $labels.workflow }} has not run in {{ $labels.org }}/{{ $labels.repo }}"
          description: "Last run was {{ $value | humanizeDuration }} ago, well past its configured schedule interval plus the delay GitHub normally adds to scheduled runs."

      # An open PR whose checks are failing. Distinct from
      # GitHubCIFailingDefaultBranch: that rule describes what has already
      # landed, this one describes work that cannot land.
      #
      # Bots are deliberately included. A renovate PR failing CI is at least as
      # actionable as a human one, because it blocks a dependency bump and will
      # sit there indefinitely -- that is exactly the state that went unnoticed
      # on github-ci-exporter and freminal.
      #
      # Drafts are excluded by the exporter, so no filter is needed here.
      #
      # 1h rather than the 15m used for branch CI: a PR is usually pushed to
      # several times in quick succession, and each push restarts its checks.
      - alert: GitHubPullRequestChecksFailing
        expr: github_pull_needs_attention{checks="failure"} == 1
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "PR #{{ $labels.number }} failing checks in {{ $labels.org }}/{{ $labels.repo }}"
          description: "Checks on pull request #{{ $labels.number }} by {{ $labels.author }} are failing, so it cannot merge."

      # Green, mergeable, and no auto-merge armed: nothing will land this
      # without a human pressing the button. Renovate PRs sit in this state on
      # repositories where platformAutomerge is off.
      #
      # 6h so a PR that is merged promptly never alerts; this is a "you have
      # forgotten about this" signal, not a notification that CI passed.
      - alert: GitHubPullRequestAwaitingMerge
        expr: github_pull_ready_to_merge == 1
        for: 6h
        labels:
          severity: info
        annotations:
          summary: "PR #{{ $labels.number }} is green and waiting to merge in {{ $labels.org }}/{{ $labels.repo }}"
          description: "Checks pass and there are no conflicts, but auto-merge is not enabled, so #{{ $labels.number }} needs a manual merge."

      # A human pull request left open for a month. Bot PRs are excluded
      # entirely -- renovate and dependabot routinely hold PRs open by design,
      # and including them would make this fire constantly.
      #
      # Drafts are excluded: an open draft is work in progress, not a stalled
      # review.
      - alert: GitHubHumanPullRequestStale
        expr: |
          (time() - github_pull_created_timestamp_seconds{author_kind="human", draft="false"})
            > 30 * 24 * 3600
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "PR #{{ $labels.number }} open {{ $value | humanizeDuration }} in {{ $labels.org }}/{{ $labels.repo }}"
          description: "Pull request #{{ $labels.number }} by {{ $labels.author }} has been open for over 30 days."

  # Health of the exporter itself. Without these, an exporter that has died or
  # exhausted its API budget is indistinguishable from a fleet whose CI is
  # entirely green -- the same silent-failure trap meta-alerts.yaml exists to
  # close for the monitoring stack.
  - name: github-ci-exporter
    rules:
      - alert: GitHubExporterDown
        expr: up{job="github-ci"} == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "github-ci-exporter is not responding"
          description: "Prometheus cannot scrape the GitHub CI exporter on sdrhub. All CI visibility is blind."

      # The exporter serves metrics even when collection fails, so `up` alone
      # is not sufficient: a broken token or a GitHub outage leaves the
      # process healthy and the data frozen.
      - alert: GitHubExporterCollectionFailing
        expr: github_exporter_scrape_success == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "github-ci-exporter cannot collect from GitHub"
          description: "Collection cycles have been failing for 30 minutes. Displayed CI state is stale. Check the token and GitHub's status."

      # Backstop for a failure mode neither of the above catches: the process
      # is up and the last cycle reported success, but the timer has stopped
      # or every cycle is being skipped. Three intervals of slack on a 5m
      # cycle.
      - alert: GitHubExporterStale
        expr: time() - github_exporter_last_success_timestamp_seconds > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "github-ci-exporter data is stale"
          description: "No successful collection cycle for {{ $value | humanizeDuration }}, despite the exporter being reachable."

      # The exporter withholds a reserve and skips a cycle it cannot afford,
      # so budget pressure degrades into staleness rather than errors. That
      # makes it quiet, which is exactly why it needs its own alert.
      - alert: GitHubExporterBudgetExhausted
        expr: github_exporter_budget_exhausted == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "github-ci-exporter skipped a cycle to protect the API budget"
          description: "The remaining GitHub API budget could not cover a full sweep, so collection was skipped. CI state is not being refreshed."

      # Early warning, before the pre-flight check starts skipping cycles.
      # 500 of 5000 is comfortably above the 250 reserve, so this fires while
      # there is still room to act.
      - alert: GitHubExporterRateLimitLow
        expr: github_exporter_rate_limit_remaining < 500
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "GitHub API budget low for {{ $labels.resource }}"
          description: "Only {{ $value }} requests remain in the {{ $labels.resource }} pool. The exporter will start skipping cycles as it approaches its reserve."

  # Flake inputs of the repositories github-ci-exporter tracks (flake_repos),
  # and the NixOS channels they follow. See
  # agent-docs/plans/PLAN_03_FLAKE_INPUT_TRACKING.md.
  #
  # JOINS
  #
  # The github_flake_input_* families label the repository as
  # repo="owner/name"; the github_pull_* families split it into org and repo.
  # Joins between them build a common flake_repo label on both sides
  # (label_replace on one, label_join on the other) rather than relying on
  # either convention.
  - name: github-flake-inputs
    rules:
      # A root input has been behind upstream for longer than its policy
      # allows, bumping it changes source (not just a rebuild of an owned
      # nixpkgs; see the impact classification), and no update PR is open.
      #
      # Age is from the oldest upstream commit the input is missing, so busy
      # upstreams cannot keep resetting it, and it is the input's worst node:
      # an owned nixpkgs that is behind counts against its input.
      #
      # The maximum age comes from .github/flake-input-policy.json through
      # flake_input_policy:*max_age_seconds (generated recording rules; see
      # modules/monitoring/master/flake-input-policy-rules.nix): the input's
      # own value where it has one, the default otherwise.
      #
      # Normally an auto-policy source change gets its update PR from the
      # watch Action within the hour, so this mostly fires for manual-policy
      # inputs, or when that dispatch keeps failing.
      - alert: FlakeInputOutdated
        expr: |
          (
            (
              max by (repo, input) (time() - github_flake_input_outdated_since_timestamp_seconds)
                > on (input) group_left () flake_input_policy:max_age_seconds
            )
            or
            (
              max by (repo, input) (time() - github_flake_input_outdated_since_timestamp_seconds)
                > on () group_left () flake_input_policy:default_max_age_seconds
              unless on (input) flake_input_policy:max_age_seconds
            )
          )
          and on (repo, input) (github_flake_input_impact{kind="source"} == 1)
          unless on (repo, input) (github_flake_input_update_pr_open == 1)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Flake input {{ $labels.input }} in {{ $labels.repo }} has been behind for {{ $value | humanizeDuration }}"
          description: "Bumping it changes source, it is past its maximum age in .github/flake-input-policy.json, and no update-{{ $labels.input }} PR is open."

      # An update-<input> PR that has been open for more than 3 days and whose
      # checks are failing: the bump is blocked, usually on an upstream fix
      # (#2790 and #2786 sat like this for days on brave and catppuccin).
      # Joined on the PR number the exporter records for each input's open
      # update PR.
      - alert: FlakeInputUpdateStuck
        expr: |
          label_replace(github_flake_input_update_pr_open == 1, "flake_repo", "$1", "repo", "(.*)")
          and on (flake_repo, number)
          label_join(github_pull_needs_attention{checks="failure"} == 1, "flake_repo", "/", "org", "repo")
          and on (flake_repo, number)
          label_join(
            time() - github_pull_created_timestamp_seconds > 3 * 24 * 3600,
            "flake_repo", "/", "org", "repo"
          )
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Update PR #{{ $labels.number }} for {{ $labels.input }} is stuck in {{ $labels.repo }}"
          description: "update-{{ $labels.input }} has been open for over 3 days with failing checks."

      # A tracked node follows a NixOS channel that is no longer supported:
      # `nix flake update` follows a ref and can never leave it, so the input
      # silently stops receiving fixes. Root channel inputs and owned nixpkgs
      # nodes alike (nixos-needsreboot sat on nixos-25.11 exactly this way).
      - alert: FlakeInputOnEolChannel
        expr: |
          count by (repo, input, path, channel) (github_flake_input_locked_timestamp_seconds{channel!=""})
          and on (channel) (nixos_channel_current == 0)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.path }} in {{ $labels.repo }} follows end-of-life channel {{ $labels.channel }}"
          description: "nixos_channel_current is 0 for {{ $labels.channel }}. Move the ref to a supported channel; flake updates cannot leave it on their own."

  - name: nixos-channels
    rules:
      # A channel our locks follow has not advanced in 3 days and its tested
      # job is failing on Hydra: updates are blocked upstream, not on us.
      # nixos-unstable sat for three days like this while the brave re-add
      # waited behind it. Only channels some tracked node follows.
      - alert: NixosChannelBlocked
        expr: |
          (time() - nixos_channel_update_timestamp_seconds > 3 * 24 * 3600)
          and on (channel) (nixos_channel_tested_failed == 1)
          and on (channel) count by (channel) (github_flake_input_locked_timestamp_seconds{channel!=""})
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "NixOS channel {{ $labels.channel }} has not moved in {{ $value | humanizeDuration }}"
          description: "Its tested job is failing on Hydra, so the channel is blocked upstream. Inputs following it cannot update until it moves."

      # The flake-input-watch workflow has not succeeded recently, so impact
      # classifications and source-change dispatches are going stale.
      #
      # 6h rather than the plan's 3h: GitHub drops and delays scheduled runs
      # heavily (its first night ran twice in fourteen hours), and the alert
      # is about the watch being broken, not about GitHub's scheduler.
      - alert: FlakeWatchStale
        expr: |
          time() - github_workflow_last_success_timestamp_seconds{org="fredsystems", repo="nixos", workflow="flake-input-watch"}
            > 6 * 3600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "flake-input-watch has not succeeded in {{ $value | humanizeDuration }}"
          description: "Flake input impact and update dispatches are stale. Check the workflow's recent runs in fredsystems/nixos."

      # The same failure from the start: the exporter has no last-success
      # series for the watch at all, because it has never succeeded (or every
      # run since tracking began was cancelled, skipped or failed), so
      # FlakeWatchStale has nothing to compare against. Scoped to this one
      # workflow, and only while the exporter is publishing other workflows'
      # successes, so an exporter outage stays GitHubExporterDown's alert.
      - alert: FlakeWatchNeverSucceeded
        expr: |
          absent(github_workflow_last_success_timestamp_seconds{org="fredsystems", repo="nixos", workflow="flake-input-watch"})
          and on () (count(github_workflow_last_success_timestamp_seconds) > 0)
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "flake-input-watch has no successful run on record"
          description: "github-ci-exporter sees other workflows' successes but none for flake-input-watch in fredsystems/nixos, so flake input impact is not being published. Check the workflow's runs."
