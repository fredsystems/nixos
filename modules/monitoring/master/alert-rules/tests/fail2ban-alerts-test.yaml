# promtool unit tests for the fail2ban ban-metrics pipeline rules.
#
# Gotcha, documented in smart-alerts-test.yaml and re-stated here because it
# bites every new file in this directory: rules evaluate at the top-level
# evaluation_interval, but samples are spaced at each test's own `interval`.
# If `interval` exceeds Prometheus' 5m lookback delta the series is stale at
# most evaluation steps and a `for:` clause never accumulates a continuous
# pending period. Keep every interval <= 5m and make input_series long enough
# to cover the rule's `for:` plus eval_time.
#
# The staleness and absent() rules need care beyond that:
#
#   - Fail2banBanMetricsStale compares against time(), so the timestamp values
#     must be absolute epoch seconds consistent with the test clock, which
#     starts at 0. A series holding 0 is therefore "generated at epoch 0" and
#     goes stale immediately, which is what the firing case relies on.
#   - Fail2banBanMetricsMissing uses absent(), which needs the series to be
#     genuinely absent. Its firing case supplies an unrelated series so the
#     test has something to evaluate against.
rule_files:
  - ../fail2ban-alerts.yaml

evaluation_interval: 1m

tests:
  #########################################################################
  # Fail2banDown
  #########################################################################
  - interval: 1m
    name: Fail2banDown fires when the daemon cannot be reached
    input_series:
      - series: 'f2b_ban_metrics_fail2ban_up{hostname="fredvps", instance="fredvps.tailc21fc7.ts.net:9100", job="node", role="agent"}'
        values: "0+0x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: Fail2banDown
        exp_alerts:
          - exp_labels:
              severity: critical
              hostname: fredvps
              instance: fredvps.tailc21fc7.ts.net:9100
              job: node
              role: agent
            exp_annotations:
              summary: "fail2ban is unreachable on fredvps"
              description: "fail2ban-client cannot retrieve the jail list, so no ban state is being read and the security dashboard is showing an empty table with a fresh timestamp. Bans may not be enforced at all. Check fail2ban.service."

  - interval: 1m
    name: Fail2banDown silent while fail2ban is up
    input_series:
      - series: 'f2b_ban_metrics_fail2ban_up{hostname="fredvps"}'
        values: "1+0x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: Fail2banDown
        exp_alerts: []

  - interval: 1m
    name: Fail2banDown does not fire on a short restart blip
    # Down for 5 minutes then recovered -- shorter than the 10m `for:`, which
    # is the fail2ban-restart-during-activation case the delay exists for.
    input_series:
      - series: 'f2b_ban_metrics_fail2ban_up{hostname="fredvps"}'
        values: "0+0x5 1+0x25"
    alert_rule_test:
      - eval_time: 20m
        alertname: Fail2banDown
        exp_alerts: []

  #########################################################################
  # Fail2banJailQueryFailing
  #########################################################################
  - interval: 1m
    name: Fail2banJailQueryFailing fires when a jail query fails
    input_series:
      - series: 'f2b_ban_metrics_jail_query_failures{hostname="fredvps", role="agent"}'
        values: "1+0x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: Fail2banJailQueryFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              hostname: fredvps
              role: agent
            exp_annotations:
              summary: "fail2ban jail queries failing on fredvps"
              description: "1 jail(s) could not be queried for their ban list. Those jails are missing from the dashboard while the rest of the data looks healthy. Usually a socket timeout or a jail that stopped between the status call and the per-jail query."

  - interval: 1m
    name: Fail2banJailQueryFailing silent when all queries succeed
    input_series:
      - series: 'f2b_ban_metrics_jail_query_failures{hostname="fredvps"}'
        values: "0+0x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: Fail2banJailQueryFailing
        exp_alerts: []

  #########################################################################
  # Fail2banBanMetricsStale
  #########################################################################
  - interval: 1m
    name: Fail2banBanMetricsStale fires when the generator stops
    # Timestamp frozen at epoch 0 while the test clock advances, so age
    # crosses 600s at t=10m and the 10m `for:` completes at t=20m.
    input_series:
      - series: 'f2b_ban_metrics_generated_timestamp_seconds{hostname="fredvps", role="agent"}'
        values: "0+0x40"
    alert_rule_test:
      - eval_time: 25m
        alertname: Fail2banBanMetricsStale
        exp_alerts:
          - exp_labels:
              severity: warning
              hostname: fredvps
              role: agent
            exp_annotations:
              summary: "fail2ban ban metrics are stale on fredvps"
              description: "The ban-metrics textfile has not been regenerated in over 10 minutes against a 2-minute timer. The Active Bans table is showing stale data, which is indistinguishable from an empty one. Check fail2ban-ban-metrics.service and its timer."

  - interval: 1m
    name: Fail2banBanMetricsStale silent while the timer keeps up
    # Advances 60 per minute, so age stays at ~0 and never approaches 600s.
    input_series:
      - series: 'f2b_ban_metrics_generated_timestamp_seconds{hostname="fredvps"}'
        values: "0+60x40"
    alert_rule_test:
      - eval_time: 25m
        alertname: Fail2banBanMetricsStale
        exp_alerts: []

  #########################################################################
  # Fail2banBanMetricsMissing
  #########################################################################
  - interval: 1m
    name: Fail2banBanMetricsMissing fires when the series is gone entirely
    # An unrelated series so there is something to evaluate; the rule's own
    # selector matches nothing, which is the condition under test.
    input_series:
      - series: 'up{job="node", hostname="fredvps"}'
        values: "1+0x80"
    alert_rule_test:
      - eval_time: 70m
        alertname: Fail2banBanMetricsMissing
        exp_alerts:
          # absent() synthesises a series carrying the equality matchers from
          # its argument, so hostname="fredvps" appears on the alert even
          # though no such series exists. That is useful here -- the
          # notification names the host it is talking about.
          - exp_labels:
              severity: warning
              hostname: fredvps
            exp_annotations:
              summary: "fail2ban ban metrics are missing entirely from fredvps"
              description: "No f2b_ban_metrics_fail2ban_up series exists, so every other rule in this group is silently matching nothing and cannot fire. Either the node_exporter textfile collector has lost the file or fail2ban-ban-metrics.service has never run. If fail2ban was intentionally removed from this host, delete this rule group."

  - interval: 1m
    name: Fail2banBanMetricsMissing silent when the metric is present
    # Present and reporting a FAILURE (0). Absence and failure are different
    # conditions -- this rule must stay quiet and let Fail2banDown handle it.
    input_series:
      - series: 'f2b_ban_metrics_fail2ban_up{hostname="fredvps"}'
        values: "0+0x80"
    alert_rule_test:
      - eval_time: 70m
        alertname: Fail2banBanMetricsMissing
        exp_alerts: []

  #########################################################################
  # Fail2banParseFailures
  #########################################################################
  - interval: 1m
    name: Fail2banParseFailures fires on sustained parse failures
    input_series:
      - series: 'f2b_ban_metrics_parse_failures{hostname="fredvps", role="agent"}'
        values: "3+0x50"
    alert_rule_test:
      - eval_time: 40m
        alertname: Fail2banParseFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              hostname: fredvps
              role: agent
            exp_annotations:
              summary: "fail2ban ban output is not parsing on fredvps"
              description: "3 line(s) from fail2ban-client did not match the expected `<ip> <start> + <bantime> = <expiry>` layout. Likely a fail2ban upgrade changed the output format; the Active Bans table is incomplete or empty. Compare `fail2ban-client get <jail> banip --with-time` against the parser in hosts/linux/fredvps/configuration.nix."

  - interval: 1m
    name: Fail2banParseFailures ignores a transient blip
    # 10 minutes of failures then clean -- under the 30m `for:`.
    input_series:
      - series: 'f2b_ban_metrics_parse_failures{hostname="fredvps"}'
        values: "1+0x10 0+0x40"
    alert_rule_test:
      - eval_time: 45m
        alertname: Fail2banParseFailures
        exp_alerts: []

  #########################################################################
  # Fail2banBanRateSpike
  #
  # The baseline stretch has to be long relative to the spike, because the
  # spike is inside its own avg_over_time window and dilutes the ratio it is
  # being measured against. That is the self-resolving behaviour documented on
  # the rule, and it is why these series run for hours rather than minutes.
  #########################################################################
  - interval: 1m
    name: Fail2banBanRateSpike fires on a sustained step change
    input_series:
      # 10h at 5 bans/hour, then 90m at 100. At the 690m mark the 7d mean is
      # ~17, so the 4x threshold is ~70 and the floor of 25 is well clear.
      - series: 'f2b_jail_bans_started_1h{hostname="fredvps", jail="port-decoy", role="agent"}'
        values: "5+0x600 100+0x90"
    alert_rule_test:
      - eval_time: 690m
        alertname: Fail2banBanRateSpike
        exp_alerts:
          - exp_labels:
              severity: warning
              hostname: fredvps
              jail: port-decoy
              role: agent
            exp_annotations:
              summary: "fail2ban ban rate in jail port-decoy stepped up on fredvps"
              description: "Jail port-decoy banned 100 address(es) in the last hour, more than 4x its own 7-day average. Something changed outside: a new scan campaign, a newly-exposed port, or a filter that started matching traffic it should not. Check `journalctl -u fail2ban --since '2 hours ago' | grep ' Ban '` for what is being caught, and confirm it is hostile before treating this as routine. Standing ban totals are not the concern here and are not alerted on."

  - interval: 1m
    name: Fail2banBanRateSpike silent below the absolute floor
    input_series:
      # A 20x ratio, but 20 bans/hour is not an incident on this host. The
      # floor is what stops the low-volume jails screaming at every blip.
      - series: 'f2b_jail_bans_started_1h{hostname="fredvps", jail="nginx-bad-request"}'
        values: "1+0x600 20+0x90"
    alert_rule_test:
      - eval_time: 690m
        alertname: Fail2banBanRateSpike
        exp_alerts: []

  - interval: 1m
    name: Fail2banBanRateSpike silent on a high but steady rate
    input_series:
      # Well above the floor and never moves. A busy jail is not an alert.
      - series: 'f2b_jail_bans_started_1h{hostname="fredvps", jail="port-decoy"}'
        values: "60+0x690"
    alert_rule_test:
      - eval_time: 690m
        alertname: Fail2banBanRateSpike
        exp_alerts: []

  - interval: 1m
    name: Fail2banBanRateSpike silent on a single burst hour
    input_series:
      # Elevated for 30m only. `for: 1h` is what filters this out, and it is
      # the difference between "one scanner had a moment" and "the environment
      # changed".
      - series: 'f2b_jail_bans_started_1h{hostname="fredvps", jail="nginx-probe"}'
        values: "5+0x600 100+0x30"
    alert_rule_test:
      - eval_time: 630m
        alertname: Fail2banBanRateSpike
        exp_alerts: []

  #########################################################################
  # f2b_banned_ip_outside_window has no alert, deliberately.
  #
  # Regression guard for the retired Fail2banBanListTruncated: a large number
  # of bans outside the display window must produce no alert at all. If
  # somebody reintroduces a rule on standing totals, this fails.
  #########################################################################
  - interval: 1m
    name: outside_window does not drive any ban-rate alert
    input_series:
      - series: 'f2b_banned_ip_outside_window{hostname="fredvps", jail="recidive"}'
        values: "305+0x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: Fail2banBanRateSpike
        exp_alerts: []

  #########################################################################
  # Fail2banStandingBansHigh
  #
  # for: 6h, so the series has to outlast 360m of pending. interval stays at
  # 5m per the staleness note at the top of this file.
  #########################################################################
  - interval: 5m
    name: Fail2banStandingBansHigh fires on a sustained high standing total
    input_series:
      - series: 'f2b_jail_banned_current{hostname="fredvps", jail="recidive", role="agent"}'
        values: "6000+0x100"
    alert_rule_test:
      - eval_time: 400m
        alertname: Fail2banStandingBansHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              hostname: fredvps
            exp_annotations:
              summary: "fail2ban standing ban count is far above steady state on fredvps"
              description: "6000 bans are in force across all jails, roughly 10x the expected steady state. Nothing is broken -- the packet path is unaffected by ban count and this is about 40s of fail2ban restore time -- but the arrival rate has changed and stayed changed, which Fail2banBanRateSpike stops reporting once the shift ages into its baseline. Find what grew in the Ban Rate panel, then either reduce intake, shorten the bantime of the jail responsible, or raise this threshold deliberately if the growth is legitimate."

  - interval: 5m
    name: Fail2banStandingBansHigh sums across jails rather than watching one
    input_series:
      # No single jail is close to 5000, but the host is holding 6600 bans.
      # Restore cost is per ticket, so the sum is what matters.
      - series: 'f2b_jail_banned_current{hostname="fredvps", jail="recidive"}'
        values: "3000+0x100"
      - series: 'f2b_jail_banned_current{hostname="fredvps", jail="port-decoy"}'
        values: "2400+0x100"
      - series: 'f2b_jail_banned_current{hostname="fredvps", jail="ssh-decoy"}'
        values: "1200+0x100"
    alert_rule_test:
      - eval_time: 400m
        alertname: Fail2banStandingBansHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              hostname: fredvps
            exp_annotations:
              summary: "fail2ban standing ban count is far above steady state on fredvps"
              description: "6600 bans are in force across all jails, roughly 10x the expected steady state. Nothing is broken -- the packet path is unaffected by ban count and this is about 40s of fail2ban restore time -- but the arrival rate has changed and stayed changed, which Fail2banBanRateSpike stops reporting once the shift ages into its baseline. Find what grew in the Ban Rate panel, then either reduce intake, shorten the bantime of the jail responsible, or raise this threshold deliberately if the growth is legitimate."

  - interval: 5m
    name: Fail2banStandingBansHigh silent at a normal standing total
    input_series:
      # Roughly today's shape, an order of magnitude below the threshold.
      - series: 'f2b_jail_banned_current{hostname="fredvps", jail="recidive"}'
        values: "410+0x100"
      - series: 'f2b_jail_banned_current{hostname="fredvps", jail="port-decoy"}'
        values: "60+0x100"
    alert_rule_test:
      - eval_time: 400m
        alertname: Fail2banStandingBansHigh
        exp_alerts: []

  #########################################################################
  # Fail2banJailApproachingSetLimit
  #########################################################################
  - interval: 5m
    name: Fail2banJailApproachingSetLimit fires for one oversized jail
    input_series:
      - series: 'f2b_jail_banned_current{hostname="fredvps", jail="recidive", role="agent"}'
        values: "35000+0x40"
    alert_rule_test:
      - eval_time: 120m
        alertname: Fail2banJailApproachingSetLimit
        exp_alerts:
          - exp_labels:
              severity: critical
              hostname: fredvps
              jail: recidive
              role: agent
            exp_annotations:
              summary: "fail2ban jail recidive is approaching its ipset limit on fredvps"
              description: "Jail recidive holds 35000 bans against a per-set maxelem of 65536. Past that ceiling `ipset add` fails silently: fail2ban keeps reporting the address as banned while its packets are delivered normally, so the dashboard stays green while the block does not exist. Raising maxelem requires recreating the set (`ipset -exist create` will not alter it), so treat this as scheduled work, not a page to sit on. Raise hashsize from its 1024 default at the same time."

  - interval: 5m
    name: Fail2banJailApproachingSetLimit ignores a high total spread over jails
    input_series:
      # 45000 bans on the host, but maxelem is per set and no set is near it.
      # This is the case a summed rule would get wrong in the alarming
      # direction; Fail2banStandingBansHigh is what covers the total.
      - series: 'f2b_jail_banned_current{hostname="fredvps", jail="recidive"}'
        values: "15000+0x40"
      - series: 'f2b_jail_banned_current{hostname="fredvps", jail="port-decoy"}'
        values: "15000+0x40"
      - series: 'f2b_jail_banned_current{hostname="fredvps", jail="ssh-decoy"}'
        values: "15000+0x40"
    alert_rule_test:
      - eval_time: 120m
        alertname: Fail2banJailApproachingSetLimit
        exp_alerts: []
