groups:
  - name: firmware-alerts
    rules:
      - alert: FwupdUpdatesAvailable
        # Long for: window — firmware updates appear continuously and we
        # only want a nudge, not an immediate page.
        expr: fwupd_updates_available > 0
        for: 24h
        labels:
          severity: info
        annotations:
          summary: "Firmware updates available on {{ $labels.host }}"
          description: "{{ $value }} firmware update(s) available via fwupd on {{ $labels.host }}. Run `fwupdmgr update` to apply."

      - alert: EfivarsSpaceLow
        # 40 KiB, measured against the largest write this store is actually
        # asked to accept. fwupd's dbx precondition on fredhub was 30.7 kB of
        # payload plus the 5,120 B the kernel holds back in
        # efi_query_variable_store(), i.e. ~35.8 kB; below 40 KiB the next
        # Secure Boot database update starts failing. Warning rather than info
        # because on firmware that does not garbage-collect stale records this
        # only moves one direction, and the fix may need physical access.
        expr: efivars_free_bytes < 40960
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "UEFI variable store nearly full on {{ $labels.host }}"
          # Raw bytes, deliberately not humanize1024: the whole budget lives in
          # the 5-40 kB range, where the difference between 5,923 free and the
          # 35,820 a dbx update needs is the entire point, and humanize1024
          # renders 40,959 as "40kiB" -- indistinguishable from the threshold.
          description: "Only {{ $value }} bytes free in the firmware variable store on {{ $labels.host }}. Firmware and Secure Boot database updates will start failing for lack of space, reported by fwupd as an efivarfs error rather than as a full store. Some firmware reclaims stale records only when a write provokes it; see scripts/efivars-force-gc.sh."

      - alert: FwupdCriticalUpdate
        # Critical / high urgency firmware (per LVFS metadata) should not
        # sit for a full day before notification.
        expr: max by (host) (fwupd_device_update_info{urgency=~"critical|high"}) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Critical firmware update available on {{ $labels.host }}"
          description: "fwupd reports at least one critical- or high-urgency firmware update on {{ $labels.host }}. Run `fwupdmgr get-updates` for details and `fwupdmgr update` to apply."
