# SMART disk health alerts.
#
# Metric names verified against the smartctl_exporter source rather than
# guessed: prometheus-community/smartctl_exporter exposes
# smartctl_device_{smart_status,critical_warning,media_errors,percentage_used,
# available_spare,available_spare_threshold,temperature,smartctl_exit_status}.
#
# Fleet baseline, read off the drives with smartctl 7.5 on 2026-08-03:
#
#   host      device   %used  spare  spare_thresh  media_err  TB written
#   sdrhub    nvme0       54    100            10          0        37.8
#   hfdlhub1  nvme0        5    100            10          0
#   hfdlhub2  nvme0        5    100            10          0
#   acarshub  nvme0        1    100            50          0
#   vdlmhub   nvme0        1    100            50          0
#   fredhub   nvme0        2    100            10          0
#
# NOT EVERY DRIVE IN THIS FLEET IS NVMe ANY MORE.
#
# nvrhub carries a second disk: /dev/sda, a 4 TB WD Purple (WD40PURZ) holding
# the Frigate surveillance recordings. It is a 5400 rpm SATA drive with
# 69,224 power-on hours (7.9 years) taking continuous writes from 8 cameras,
# which makes it the single most likely drive in the fleet to fail.
#
# It is scraped (verified: nvrhub.local:9633 reports device="nvme0" AND
# device="sda", both present in Prometheus), but most of the rules below are
# NVMe-only and silently do not apply to it. Verified by listing exactly what
# sda exposes:
#
#   present: smart_status, smartctl_exit_status, temperature, attribute,
#            power_on_seconds, power_cycle_count, error_log_count,
#            rotation_rate, capacity_*, block_size, interface_speed
#   ABSENT:  critical_warning, media_errors, available_spare,
#            available_spare_threshold, percentage_used
#
# So of the seven rules that existed before, only SmartDeviceFailing and
# SmartctlCannotReadDevice covered this drive. Spinning disks report
# pre-failure state through SMART ATTRIBUTES instead, which the exporter
# exposes as smartctl_device_attribute{attribute_name=...,
# attribute_value_type="raw"}. The ata-attributes group at the end of this
# file covers those, so the spinning disk is not left with two rules while
# the NVMes have seven.
#
# Two facts drive the thresholds below, both verified directly:
#
#   1. sdrhub is at 54% of its rated write endurance with 37.8 TB written.
#      Every host runs a single NVMe with no redundancy and the decoders write
#      continuously, so endurance exhaustion is the realistic failure mode.
#   2. acarshub and vdlmhub report an Available Spare Threshold of 50%, not the
#      10% the other four report. A hardcoded "spare < 10%" rule would be
#      wrong for those two, so SmartAvailableSpareLow compares against the
#      drive's own reported threshold instead of a constant.
#
# fredvps is excluded at the exporter level: it is a QEMU guest whose virtual
# disk reports "SMART support is: Unavailable - device lacks SMART capability".
#
# scripts/check-alert-metrics.sh will report every metric here as MISSING until
# the exporter is deployed. That is expected, and the script's own failure text
# says so.
groups:
  - name: smart-alerts
    rules:
      # The drive's own overall verdict. 1 is passing, 0 is failing. When a
      # drive says it is failing, that is not a threshold to tune.
      - alert: SmartDeviceFailing
        expr: smartctl_device_smart_status == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SMART self-assessment FAILED on {{ $labels.hostname }} ({{ $labels.device }})"
          description: "The drive reports its own overall health as failing. Replace it. This host has a single NVMe with no redundancy."

      # NVMe critical warning is a bitfield: spare below threshold, temperature
      # excursion, degraded reliability, read-only mode, failed volatile memory
      # backup. Any bit set is actionable, so alert on non-zero rather than
      # decoding individual bits.
      - alert: SmartCriticalWarning
        expr: smartctl_device_critical_warning > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "NVMe critical warning on {{ $labels.hostname }} ({{ $labels.device }})"
          description: "The controller has raised a critical warning bitfield (value {{ $value }}). Causes include available spare below threshold, temperature excursion, degraded reliability, or the drive having gone read-only."

      # Uncorrectable data-integrity errors. Fleet baseline is exactly 0 on
      # every drive, so any increase is genuinely anomalous rather than a
      # threshold that needs tuning.
      - alert: SmartMediaErrors
        expr: increase(smartctl_device_media_errors[1h]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Media errors increasing on {{ $labels.hostname }} ({{ $labels.device }})"
          description: "The drive has recorded new uncorrectable data-integrity errors in the last hour. Fleet baseline for this counter is zero across all drives."

      # Spare blocks compared against the DRIVE'S OWN reported threshold, not a
      # constant -- acarshub and vdlmhub report 50% where the others report 10%.
      # Crossing the manufacturer's own threshold is what sets the
      # corresponding critical_warning bit, so this is a pre-failure signal.
      - alert: SmartAvailableSpareLow
        expr: |
          smartctl_device_available_spare
            <= on (hostname, device) group_left ()
          smartctl_device_available_spare_threshold
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Spare blocks exhausted on {{ $labels.hostname }} ({{ $labels.device }})"
          description: "Available spare has fallen to or below the drive's own reported threshold. The controller is running out of blocks to remap failures onto."

      # Write endurance. percentage_used is the controller's own estimate of
      # rated lifetime consumed; 100 means the endurance rating is spent, and
      # it can exceed 100.
      #
      # Warning at 80: sdrhub is at 54% after 24878 power-on hours (2.8 years),
      # so it is tracking toward roughly 19 bytes per byte of remaining life.
      # 80 gives many months of notice at that rate -- long enough to order a
      # replacement without urgency.
      #
      # Critical at 95 rather than 100, because the point is to replace the
      # drive before the rating is exhausted, not after.
      - alert: SmartWearoutWarning
        expr: smartctl_device_percentage_used >= 80 and smartctl_device_percentage_used < 95
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Disk wear at {{ $value }}% on {{ $labels.hostname }} ({{ $labels.device }})"
          description: "The drive reports {{ $value }}% of its rated write endurance consumed. Plan a replacement. Single NVMe, no redundancy."

      - alert: SmartWearoutCritical
        expr: smartctl_device_percentage_used >= 95
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Disk endurance nearly exhausted on {{ $labels.hostname }} ({{ $labels.device }})"
          description: "The drive reports {{ $value }}% of its rated write endurance consumed. Replace it now."

      # The exporter forks smartctl per device; a non-zero exit means it could
      # not read the drive. Without this the SMART rules above would go quiet
      # rather than firing, which is the silent-failure mode this whole
      # alerting overhaul exists to eliminate.
      #
      # Bit 0 (value 1) means a command-line or device-open failure. The higher
      # bits are SMART status flags that the dedicated rules above already
      # cover, so this deliberately matches only the low bit.
      - alert: SmartctlCannotReadDevice
        expr: (smartctl_device_smartctl_exit_status % 2) == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "smartctl cannot read {{ $labels.device }} on {{ $labels.hostname }}"
          description: "The exporter's smartctl invocation is failing to open the device, so no SMART data is being collected for it. Every SMART alert for this drive is inoperative until this is resolved."

  # ATA / SATA pre-failure attributes.
  #
  # These exist because the rules above are NVMe-shaped and therefore did not
  # cover nvrhub's /dev/sda at all (see the header for the verified list of
  # what that drive does and does not expose). Spinning disks signal impending
  # failure through the classic SMART attribute set instead.
  #
  # All thresholds are ">0 is abnormal" rather than tuned numbers, because the
  # baseline was read off the drive directly on 2026-08-10 and every one of
  # these counters is exactly 0:
  #
  #   Reallocated_Sector_Ct   0      Current_Pending_Sector  0
  #   Offline_Uncorrectable   0      UDMA_CRC_Error_Count    0
  #   Reallocated_Event_Count 0      Spin_Retry_Count        0
  #
  # A zero baseline is what makes "any nonzero" a legitimate rule rather than
  # a guess. These are also selected on attribute_value_type="raw": the
  # exporter emits raw/value/worst/thresh series per attribute, and only `raw`
  # is the actual count. Alerting on `value` would be inverted -- it is a
  # normalised 0-253 health score where HIGHER is better.
  - name: smart-ata-attributes
    rules:
      # Sectors the drive has already remapped. The canonical "this disk is
      # dying" signal: healthy drives sit at 0 for their whole service life,
      # and once remapping starts it typically accelerates.
      - alert: SmartAtaReallocatedSectors
        expr: |
          smartctl_device_attribute{attribute_name="Reallocated_Sector_Ct",attribute_value_type="raw"} > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Reallocated sectors on {{ $labels.hostname }} ({{ $labels.device }})"
          description: "The drive has remapped {{ $value }} sector(s) after write/read failures. Baseline across this fleet is 0. On a single-disk surveillance volume with no redundancy, plan replacement now rather than waiting for the count to grow."

      # Sectors the drive cannot read and has not yet been able to remap --
      # it is waiting for a write to decide their fate. Unlike reallocated
      # sectors this represents data that may ALREADY be unreadable, so it is
      # the more urgent of the two.
      - alert: SmartAtaPendingSectors
        expr: |
          smartctl_device_attribute{attribute_name="Current_Pending_Sector",attribute_value_type="raw"} > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Pending unreadable sectors on {{ $labels.hostname }} ({{ $labels.device }})"
          description: "{{ $value }} sector(s) are unreadable and awaiting remap. Recordings written to those sectors may already be lost. Replace the drive."

      # Sectors that failed a read and could not be recovered even offline.
      - alert: SmartAtaOfflineUncorrectable
        expr: |
          smartctl_device_attribute{attribute_name="Offline_Uncorrectable",attribute_value_type="raw"} > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Uncorrectable sectors on {{ $labels.hostname }} ({{ $labels.device }})"
          description: "{{ $value }} sector(s) failed offline surface scan and could not be corrected. This is confirmed unrecoverable data loss on the affected sectors."

      # Cable/connector integrity, not platter health. Worth separating: a
      # rising CRC count is usually a reseat-the-SATA-cable problem, and
      # treating it as a dying disk sends you replacing the wrong component.
      - alert: SmartAtaCrcErrors
        expr: |
          increase(smartctl_device_attribute{attribute_name="UDMA_CRC_Error_Count",attribute_value_type="raw"}[6h]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "SATA CRC errors increasing on {{ $labels.hostname }} ({{ $labels.device }})"
          description: "The link between controller and drive is corrupting frames. This is usually a cable or connector fault rather than the drive itself -- check the SATA cable and power connector before replacing the disk."

      # Motor struggling to spin up. On a 5400 rpm drive that has been powered
      # on for 7.9 years, mechanical wear is a real failure mode and this is
      # the earliest mechanical warning available.
      - alert: SmartAtaSpinRetries
        expr: |
          smartctl_device_attribute{attribute_name="Spin_Retry_Count",attribute_value_type="raw"} > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Spin-up retries on {{ $labels.hostname }} ({{ $labels.device }})"
          description: "The drive motor required {{ $value }} retry/retries to reach operating speed. This is a mechanical failure signal; the drive may not spin up at all after the next power cycle."

      # Temperature. Surveillance drives are rated to 70C but sustained heat
      # roughly halves service life per 10C above ~40C, and this drive is
      # already old. 50 is a genuine "airflow is inadequate" signal rather
      # than an imminent-failure one, hence warning severity.
      #
      # Uses the top-level temperature metric, which BOTH NVMe and SATA
      # drives expose, so this one rule covers the whole fleet. Baseline
      # 2026-08-10: nvrhub nvme0 36C, nvrhub sda 31C.
      - alert: SmartDriveHot
        expr: smartctl_device_temperature{temperature_type="current"} >= 50
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Drive at {{ $value }}C on {{ $labels.hostname }} ({{ $labels.device }})"
          description: "Sustained temperature at or above 50C for 30 minutes. Every 10C above roughly 40C approximately halves expected service life. Check case airflow and drive spacing."
