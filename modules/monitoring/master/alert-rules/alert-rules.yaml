groups:
  - name: node-alerts
    rules:
      - alert: NodeDown
        # Desktops sleep/shut down regularly; scope to non-desktop roles.
        expr: up{job="node", role!="desktop"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.hostname }} is DOWN"
          description: "Prometheus has not scraped {{ $labels.hostname }} for 2 minutes."

      - alert: HighNodeCPU
        expr: 100 - (avg by (hostname) (irate(node_cpu_seconds_total{mode="idle", role!="desktop"}[5m])) * 100) > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.hostname }}"
          description: "CPU usage exceeded 70% for 5 minutes."

      - alert: HighNodeMemory
        expr: (1 - (node_memory_MemAvailable_bytes{role!="desktop"} / node_memory_MemTotal_bytes{role!="desktop"})) > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.hostname }}"
          description: "Node memory usage > 80% for 5 minutes."

      # Deliberately not scoped to a mountpoint: every real filesystem counts,
      # including secondary data volumes like nvrhub's /var/lib/frigate.
      #
      # The fstype exclusions cover pseudo-filesystems that either fill as a
      # matter of course (tmpfs, ramfs) or are read-only by construction
      # (squashfs). Network mounts are absent because they are dropped at the
      # collector -- see modules/monitoring/agent/node_exporter.nix for why a
      # NAS share is not a statement about the host that mounted it.
      - alert: NodeDiskLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs|ramfs|autofs"}
           / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs|ramfs|autofs"}) < 0.10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Disk almost full on {{ $labels.hostname }} ({{ $labels.mountpoint }})"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.hostname }} has less than 10% space available."

      - alert: NodeDiskWarning
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs|ramfs|autofs"}
           / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|devtmpfs|ramfs|autofs"}) < 0.20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk filling up on {{ $labels.hostname }} ({{ $labels.mountpoint }})"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.hostname }} has less than 20% space available."

  - name: systemd-alerts
    rules:
      # github-runner-runner-* is excluded and handled by GitHubRunnerFailed
      # below instead. Those units are self-healing: modules/services/
      # github-runners.nix runs a watchdog timer every 15 minutes that
      # restarts any runner sitting in `failed`. Paging critical at 2
      # minutes for a condition that repairs itself within 15 is noise --
      # which is precisely what the 2026-08-06 GitHub outage produced.
      #
      # Note the exclusion is `github-runner-runner-.*`, not
      # `github-runner-.*`: github-runner-watchdog.service deliberately
      # stays covered by this rule, because nothing else would notice the
      # watchdog itself dying.
      - alert: SystemdUnitFailed
        expr: |
          node_systemd_unit_state{
            state="failed",
            name!~"docker-.*|github-runner-runner-.*",
            role!="desktop"
          } == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Systemd unit {{ $labels.name }} FAILED on {{ $labels.hostname }}"
          description: "The unit {{ $labels.name }} has been in a failed state for >2 minutes."

      - alert: SystemdUnitFlapping
        expr: changes(node_systemd_unit_state{state="active", name!~"docker-.*|github-runner-runner-.*", role!="desktop"}[10m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Systemd unit {{ $labels.name }} is flapping"
          description: "The unit {{ $labels.name }} changed state more than 3 times in the last 10 minutes."

      - alert: GithubRunnerCrashLoop
        expr: changes(node_systemd_unit_state{state="active", name=~"github-runner-runner-.*"}[5m]) > 6
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "GitHub runner {{ $labels.name }} appears to be crash-looping"
          description: "The unit {{ $labels.name }} cycled state more than 6 times in 5 minutes — this is too rapid to be normal CI job cycling."

      # Fires only for a runner the watchdog could NOT rescue.
      #
      # The self-healing sweep in modules/services/github-runners.nix runs
      # every 15 minutes, so 20m means "a full sweep has been and gone and
      # this unit is still failed" -- a genuine problem needing hands,
      # rather than the transient GitHub-API failures that used to strand
      # runners (see the cleanupRunner comment in that module).
      #
      # Keep this `for:` strictly greater than the watchdog's
      # OnUnitActiveSec, or this becomes the 2-minute noise it replaced.
      - alert: GitHubRunnerFailed
        expr: |
          node_systemd_unit_state{
            state="failed",
            name=~"github-runner-runner-.*",
            role!="desktop"
          } == 1
        for: 20m
        labels:
          severity: critical
        annotations:
          summary: "GitHub runner {{ $labels.name }} is stuck FAILED on {{ $labels.hostname }}"
          description: >-
            {{ $labels.name }} has been failed for over 20 minutes, so the
            github-runner-watchdog timer has already tried and failed to
            restart it. Check `journalctl -u {{ $labels.name }}` and
            `journalctl -u github-runner-watchdog`.

      # Every runner on a host down at once. Distinct from the per-unit rule
      # above because this is the state where CI stops moving entirely
      # rather than losing one slot of capacity.
      #
      # Summing the "active" series rather than counting matching units
      # matters: node_systemd_unit_state emits a series per (unit, state)
      # with a 0/1 value, so the active series still exists (as 0) for a
      # down runner. A `count(... == 1) == 0` formulation would produce an
      # empty result and could never fire.
      - alert: GitHubRunnersAllDown
        expr: |
          sum by (hostname) (
            node_systemd_unit_state{state="active", name=~"github-runner-runner-.*"}
          ) == 0
        for: 20m
        labels:
          severity: critical
        annotations:
          summary: "All GitHub runners are down on {{ $labels.hostname }}"
          description: >-
            No github-runner unit on {{ $labels.hostname }} has been active
            for 20 minutes. Self-hosted CI for this platform is stalled and
            the watchdog has not recovered it.

  - name: container-alerts
    rules:
      - alert: ContainerRestarting
        expr: changes(
          container_start_time_seconds{
          id=~"/system\\.slice/docker-.*\\.(service|scope)",
          id!~"/system\\.slice/github-runner-runner-.*"
          }[15m]
          ) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} is restarting"
          description: "{{ $labels.name }} on {{ $labels.hostname }} restarted more than 3 times in 15 minutes."

      - alert: ContainerOOM
        expr: increase(
          container_oom_events_total{
          id=~"/system\\.slice/docker-.*\\.(service|scope)",
          id!~"/system\\.slice/github-runner-runner-.*"
          }[15m]
          ) > 0
        labels:
          severity: critical
        annotations:
          summary: "Container OOMKilled"
          description: "{{ $labels.name }} on {{ $labels.hostname }} was OOM killed."

  - name: system-alerts
    rules:
      - alert: PrometheusTargetDown
        # Desktops sleep regularly; exclude their scrape targets from this alert.
        #
        # Must be count(), not sum(). `up == 0` filters to series whose value
        # is zero, so summing them always yields zero and `> 0` can never be
        # true. count() yields the number of matching series instead.
        expr: count by (job, instance) (up{role!="desktop"} == 0) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Targets for {{ $labels.job }} are DOWN"
          description: "Prometheus cannot scrape {{ $labels.instance }} for >2 minutes."

      # Inode exhaustion on ANY real filesystem, not just the root one.
      #
      # This was pinned to mountpoint="/" and therefore blind to exactly the
      # case it exists for: nvrhub's 3.6T /var/lib/frigate holds millions of
      # small recording segments, a workload that runs out of inodes long
      # before it runs out of bytes. A full volume there would have been caught
      # by NodeDiskLow; an inode-exhausted one would not have been caught at
      # all.
      #
      # vfat is excluded on top of the usual pseudo-filesystems because it has
      # no inode table and reports node_filesystem_files = 0, which makes the
      # ratio 0/0 -> NaN. Network filesystems report 0 for the same reason but
      # are already dropped at the collector; see
      # modules/monitoring/agent/node_exporter.nix.
      - alert: NodeInodesLow
        expr: |
          (node_filesystem_files_free{fstype!~"tmpfs|overlay|squashfs|devtmpfs|ramfs|autofs|vfat"}
           / node_filesystem_files{fstype!~"tmpfs|overlay|squashfs|devtmpfs|ramfs|autofs|vfat"}) < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Low inodes on {{ $labels.hostname }} ({{ $labels.mountpoint }})"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.hostname }} has less than 10% of its inodes remaining. It will fail writes while still reporting free space."

      - alert: ClockSkewDetected
        expr: abs(node_timex_offset_seconds) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Clock skew detected on {{ $labels.hostname }}"
          description: "Clock offset >100ms from NTP server."
