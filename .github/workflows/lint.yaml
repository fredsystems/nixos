---
name: Lint

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Same shape as ci-linux.yaml: a superseded push should not keep occupying
# the scarce self-hosted runners the lint job now uses.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # `gh pr view` in the merge-queue-ci-skipper composite action (used by
  # skip-if-clean below) reads the PR for the current ref.
  pull-requests: read

jobs:
  # =====================================================================
  # Fast-path job — now always runs, but only sets skip=true on merge_group
  # =====================================================================
  skip-if-clean:
    name: Skip if merge_queue produces no diff
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Merge Queue CI Check Skipper
        id: merge-queue-ci-skipper
        uses: ./.github/merge-queue-ci-skipper
        with:
          secret: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Check merge_group synthetic commit
        id: check
        run: |
          # PR mode: never skip
          if [ "${{ github.event_name }}" != "merge_group" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ steps.merge-queue-ci-skipper.outputs.skip-check }}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # =====================================================================
  # Primary Lint job
  # =====================================================================
  #
  # Self-hosted, except for fork PRs. On ubuntu-latest this job spent ~10 of
  # its ~12 minutes in exports-standalone, and ~7 of those fetching the
  # wallpaper flake inputs (CozyPixels alone is a ~1.9 GB repo): forcing
  # desktop-common's toplevel drvPath forces the catppuccin-wallpapers
  # derivation, whose `${walls-*}` sources must be in the store for that,
  # even though nothing is built. The check is deliberately not stubbed
  # around that; the self-hosted store already holds those sources, because
  # every desktop eval there forces them too. Same cold-store reasoning as
  # find-systems / colmena-parity in ci-linux.yaml.
  #
  # Fork PRs are routed to ubuntu-latest rather than skipped as the build
  # jobs are, because lint-summary would read a skip as a pass: slow, but
  # still linted. Like the build jobs' guard, this routing only prevents
  # accidents (a fork controls its own copy of this file), and merge_group
  # runs, fork PRs included, go to self-hosted on purpose. See "FORK CODE AND
  # THE SELF-HOSTED RUNNERS" in ci-linux.yaml for what actually protects them.
  # Nix is installed only there; the self-hosted runners are fleet hosts
  # that already have it (see the NO "INSTALL NIX" note in ci-linux.yaml).
  lint:
    name: Lint
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","Linux"]') }}
    needs: [skip-if-clean]
    if: ${{ needs.skip-if-clean.outputs.skip != 'true' }} # <-- now valid in PRs

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: ${{ runner.environment == 'github-hosted' }}
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Every `nix build` below goes through scripts/nix-build-no-warnings.sh:
      # Nix exits 0 on an `evaluation warning:`, so without it a warning in a
      # check passes lint, the same rule ci-linux.yaml applies to hosts.
      - name: Run flake pre-commit hooks
        # Build the pre-commit-check derivation directly instead of entering
        # the dev shell. The dev shell pulls in `colmena` from its flake input
        # (not cached by cache.nixos.org), forcing CI to compile colmena and
        # all its Cargo dependencies on every run — which is both slow and
        # prone to transient crates.io 403s. The check derivation runs the
        # same hooks at build time without that dependency.
        # This also validates the Prometheus alerting rules: the hook suite now
        # includes a `prometheus alert rules` hook running `promtool check
        # rules` plus the promtool unit tests, so no separate step is needed.
        # Verified by reintroducing the sum()/count() bug, which fails this
        # build with the specific test case that covers it.
        run: ./scripts/nix-build-no-warnings.sh --no-link --print-build-logs .#checks.x86_64-linux.pre-commit-check

      - name: Check links (online)
        # The pre-commit-check above runs in the Nix sandbox, which has no
        # network, so its lychee hook only checks local file links. Run the
        # same pinned checker and shared config (precommit-base's link-check
        # package) outside the sandbox so remote links are checked too. Like
        # the step above, this avoids entering the dev shell (colmena).
        env:
          # Lets lychee use the GitHub API for github.com links instead of
          # being rate limited.
          GITHUB_TOKEN: ${{ github.token }}
        run: git ls-files -z '*.md' '*.mdx' | xargs -0 -r nix run --inputs-from . precommit-base#link-check --

      - name: Check decoder heartbeat coverage
        # Not a pre-commit hook: this one needs a full nixosConfigurations
        # evaluation to read each host's services.adsb.containers, which is
        # far too slow to run on every commit. It compares that against the
        # decoderUnits list in loki-ruler.nix, catching both a heartbeat rule
        # for a container that no longer exists (fires forever) and a decoder
        # container with no rule at all (silently unmonitored). Both halves
        # occurred when acarsdec-3 was replaced by xng on acarshub.
        run: ./scripts/nix-build-no-warnings.sh --no-link --print-build-logs .#checks.x86_64-linux.decoder-units-sync

      - name: Check every export evaluates standalone
        # Not a pre-commit hook for the same reason: it evaluates every
        # nixosModules.* and homeModules.* export in a bare nixosSystem /
        # homeManagerConfiguration (about 90s), which a hook would add to
        # every dev-shell load. See flake/exports.nix and MODULES.md.
        run: ./scripts/nix-build-no-warnings.sh --no-link --print-build-logs .#checks.x86_64-linux.exports-standalone

      - name: Run the flake checks that are not pre-commit hooks
        # Every other flake check is also a hook, and so runs inside
        # pre-commit-check above. These are not, so without this step
        # nothing in CI ever ran them, only `nix flake check` by hand
        # (agent-docs/plans/PLAN_04_MODULE_INTERFACES.md, 4.15). Each is a
        # few seconds of evaluation. Add any new check that is not a hook
        # here too.
        run: >-
          ./scripts/nix-build-no-warnings.sh --no-link --print-build-logs
          .#checks.x86_64-linux.feature-enables-overridable
          .#checks.x86_64-linux.fleet-identity-bridge
          .#checks.x86_64-linux.sbomnix-patch-version
          .#checks.x86_64-linux.stable-channel-consistency
          .#checks.x86_64-linux.channel-gates
          .#checks.x86_64-linux.zwave-js-associations
          .#checks.x86_64-linux.home-assistant-templates

      - name: Give the VM test /dev/kvm
        # Hosted runners (fork PRs) have KVM, but not usable by the build
        # user; without it the test below fails rather than run slowly. The
        # rule GitHub documents for hosted Linux runners. Self-hosted
        # runners already have it.
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test the Home Assistant reconciler
        # A NixOS VM test of modules/services/home-assistant-reconciler, a few
        # minutes rather than seconds, so it gets its own step. It runs Home
        # Assistant from corehub's nixpkgs, so a Home Assistant bump that
        # changes the onboarding, config-flow or registry APIs fails here
        # rather than on corehub.
        run: ./scripts/nix-build-no-warnings.sh --no-link --print-build-logs .#checks.x86_64-linux.home-assistant-reconciler

      - name: Test the house watchdog
        # A NixOS VM test of nvrhub's hosts/linux/nvrhub/house-watchdog, which
        # re-arms Frigate's indoor cameras when Home Assistant is gone.
        run: ./scripts/nix-build-no-warnings.sh --no-link --print-build-logs .#checks.x86_64-linux.house-watchdog

      - name: Check SyncClipboard server/client version parity
        # The server image and the Linux client AppImage ship from a single
        # upstream tag but are pinned in two files, and only the image is
        # visible to Renovate. update-syncclipboard.yaml moves both together;
        # this is the backstop that catches any path which moves only one --
        # including a hand edit, or Renovate if its exclusion is ever removed.
        #
        # Deliberately stricter than upstream's contract, which is
        # `server >= client` rather than equality. Equality costs nothing since
        # both come from the same tag, and it means nobody has to read
        # Changes.md to decide whether a given bump is safe.
        run: |
          set -euo pipefail

          overlay_version=$(sed -n 's/^\s*version = "\(.*\)";/\1/p' overlays/syncclipboard.nix | head -1)
          image_tag=$(sed -n 's|.*syncclipboard = "jericx/syncclipboard-server:\([^"@]*\).*|\1|p' modules/data/docker-image-pins.nix | head -1)

          if [ -z "$overlay_version" ] || [ -z "$image_tag" ]; then
            echo "could not read one of the pins (overlay='$overlay_version' image='$image_tag')" >&2
            exit 1
          fi

          # The overlay stores a bare version, the image tag carries a leading v.
          if [ "$overlay_version" != "${image_tag#v}" ]; then
            echo "SyncClipboard pins disagree:" >&2
            echo "  overlays/syncclipboard.nix        version = $overlay_version" >&2
            echo "  modules/data/docker-image-pins    syncclipboard = $image_tag" >&2
            echo "Both ship from one upstream tag and must move together." >&2
            echo "Run ./scripts/sync-syncclipboard.sh to reconcile them." >&2
            exit 1
          fi

          echo "SyncClipboard pins agree: $overlay_version"

  # =====================================================================
  # Required Check Summary
  # =====================================================================
  lint-summary:
    name: Lint Summary
    runs-on: ubuntu-latest
    needs: [skip-if-clean, lint]
    if: ${{ always() }}

    steps:
      - name: Evaluate summary
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Fail on ANY needed job that failed or was cancelled. A failed
          # skip-if-clean otherwise only shows up as `lint` being "skipped",
          # which reads exactly like a legitimate no-op.
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' <<<"$NEEDS" >/dev/null; then
            echo "❌ A required job failed or was cancelled."
            exit 1
          fi

          if [ "${{ needs.skip-if-clean.outputs.skip }}" = "true" ]; then
            echo "Merge queue noop — skipping lint."
            exit 0
          fi

          echo "Lint succeeded."
          exit 0
