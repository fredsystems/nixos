---
name: Lint

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  # `gh pr view` in the merge-queue-ci-skipper composite action (used by
  # skip-if-clean below) reads the PR for the current ref.
  pull-requests: read

jobs:
  # =====================================================================
  # Fast-path job — now always runs, but only sets skip=true on merge_group
  # =====================================================================
  skip-if-clean:
    name: Skip if merge_queue produces no diff
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Merge Queue CI Check Skipper
        id: merge-queue-ci-skipper
        uses: ./.github/merge-queue-ci-skipper
        with:
          secret: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Check merge_group synthetic commit
        id: check
        run: |
          # PR mode: never skip
          if [ "${{ github.event_name }}" != "merge_group" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ steps.merge-queue-ci-skipper.outputs.skip-check }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  # =====================================================================
  # Primary Lint job
  # =====================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [skip-if-clean]
    if: ${{ needs.skip-if-clean.outputs.skip != 'true' }} # <-- now valid in PRs

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run flake pre-commit hooks
        # Build the pre-commit-check derivation directly instead of entering
        # the dev shell. The dev shell pulls in `colmena` from its flake input
        # (not cached by cache.nixos.org), forcing CI to compile colmena and
        # all its Cargo dependencies on every run — which is both slow and
        # prone to transient crates.io 403s. The check derivation runs the
        # same hooks at build time without that dependency.
        # This also validates the Prometheus alerting rules: the hook suite now
        # includes a `prometheus alert rules` hook running `promtool check
        # rules` plus the promtool unit tests, so no separate step is needed.
        # Verified by reintroducing the sum()/count() bug, which fails this
        # build with the specific test case that covers it.
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.pre-commit-check

      - name: Check decoder heartbeat coverage
        # Not a pre-commit hook: this one needs a full nixosConfigurations
        # evaluation to read each host's services.adsb.containers, which is
        # far too slow to run on every commit. It compares that against the
        # decoderUnits list in loki-ruler.nix, catching both a heartbeat rule
        # for a container that no longer exists (fires forever) and a decoder
        # container with no rule at all (silently unmonitored). Both halves
        # occurred when acarsdec-3 was replaced by xng on acarshub.
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.decoder-units-sync

      - name: Check SyncClipboard server/client version parity
        # The server image and the Linux client AppImage ship from a single
        # upstream tag but are pinned in two files, and only the image is
        # visible to Renovate. update-syncclipboard.yaml moves both together;
        # this is the backstop that catches any path which moves only one --
        # including a hand edit, or Renovate if its exclusion is ever removed.
        #
        # Deliberately stricter than upstream's contract, which is
        # `server >= client` rather than equality. Equality costs nothing since
        # both come from the same tag, and it means nobody has to read
        # Changes.md to decide whether a given bump is safe.
        run: |
          set -euo pipefail

          overlay_version=$(sed -n 's/^\s*version = "\(.*\)";/\1/p' overlays/syncclipboard.nix | head -1)
          image_tag=$(sed -n 's|.*syncclipboard = "jericx/syncclipboard-server:\([^"@]*\).*|\1|p' modules/data/docker-image-pins.nix | head -1)

          if [ -z "$overlay_version" ] || [ -z "$image_tag" ]; then
            echo "could not read one of the pins (overlay='$overlay_version' image='$image_tag')" >&2
            exit 1
          fi

          # The overlay stores a bare version, the image tag carries a leading v.
          if [ "$overlay_version" != "${image_tag#v}" ]; then
            echo "SyncClipboard pins disagree:" >&2
            echo "  overlays/syncclipboard.nix        version = $overlay_version" >&2
            echo "  modules/data/docker-image-pins    image   = $image_tag" >&2
            echo "Both ship from one upstream tag and must move together." >&2
            echo "Run ./scripts/sync-syncclipboard.sh to reconcile them." >&2
            exit 1
          fi

          echo "SyncClipboard pins agree: $overlay_version"

  # =====================================================================
  # Required Check Summary
  # =====================================================================
  lint-summary:
    name: Lint Summary
    runs-on: ubuntu-latest
    needs: [skip-if-clean, lint]
    if: ${{ always() }}

    steps:
      - name: Evaluate summary
        run: |
          if [ "${{ needs.skip-if-clean.outputs.skip }}" = "true" ]; then
            echo "Merge queue noop — skipping lint."
            exit 0
          fi

          STATUS="${{ needs.lint.result }}"

          if [ "$STATUS" = "failure" ]; then
            echo "Lint failed"
            exit 1
          fi

          if [ "$STATUS" = "cancelled" ]; then
            echo "Lint cancelled"
            exit 1
          fi

          echo "Lint succeeded."
          exit 0
