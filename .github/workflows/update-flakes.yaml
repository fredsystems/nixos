---
name: update-flakes

on:
  schedule:
    # Weekly auto-merge run for everything except the manual-merge inputs.
    - cron: "0 5 * * 0"
    # Monthly run for the manual-merge inputs (currently: nixpkgs-kernel).
    # Server kernel bumps require a planned reboot, so they get reviewed
    # by hand instead of riding the auto-merge train.
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Which input set to update"
        type: choice
        required: true
        default: "auto"
        options:
          - auto
          - manual
          - both

permissions:
  contents: write
  pull-requests: write

jobs:
  get-flake-inputs:
    name: Get Flake Inputs
    runs-on: ubuntu-latest
    outputs:
      flakes: ${{ steps.split.outputs.flakes }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: flake.lock
          persist-credentials: false

      - id: split
        # Build the matrix of flake inputs to update on this invocation.
        # Each entry carries the input name and its merge policy (auto vs
        # manual); inputs that should be skipped this invocation are
        # filtered out of the matrix entirely so they never appear as
        # jobs in the run summary.
        #
        # MANUAL_INPUTS is the single source of truth for which inputs
        # are held back from the weekly auto-merge run.
        env:
          MANUAL_INPUTS: '["nixpkgs-kernel"]'
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          run_auto=false
          run_manual=false
          case "$EVENT" in
            schedule)
              if [[ "$SCHEDULE" == "0 5 * * 0" ]]; then
                run_auto=true
              elif [[ "$SCHEDULE" == "0 6 1 * *" ]]; then
                run_manual=true
              fi
              ;;
            workflow_dispatch)
              case "$TARGET" in
                auto)   run_auto=true ;;
                manual) run_manual=true ;;
                both)   run_auto=true; run_manual=true ;;
              esac
              ;;
          esac

          flakes=$(jq -nc \
            --argjson all "$(jq -c '.nodes.root.inputs | keys' flake.lock)" \
            --argjson manual "$MANUAL_INPUTS" \
            --arg run_auto "$run_auto" \
            --arg run_manual "$run_manual" '
            $all
            | map(. as $name | {
                name: $name,
                kind: (if ($manual | index($name)) then "manual" else "auto" end)
              })
            | map(select(
                if .kind == "manual"
                then $run_manual == "true"
                else $run_auto   == "true"
                end))
          ')
          echo "flakes={\"include\": $flakes}" >> "$GITHUB_OUTPUT"

      - name: Warn on channel refs that have stopped moving
        # `nix flake update <input>` follows a ref; it can never change
        # the ref.  So when a channel goes EOL upstream, every future run
        # of this workflow succeeds with an empty diff and opens no PR --
        # "up to date" and "pinned to a corpse" look identical from the
        # outside.  nixpkgs-kernel sat on the dead nixos-25.11-small
        # branch for a month exactly this way.
        #
        # This step makes that state visible.  It is deliberately NOT an
        # opt-out blanket age check: inputs pinned to a release tag
        # (nix-flatpak) or backed by low-churn repos (the walls-* /
        # wallpaper inputs) are legitimately old and would drown the
        # signal.  Only inputs that track a dated channel ref -- where
        # "frozen" genuinely means "EOL" -- are listed here.
        #
        # Non-fatal by design: the point is a visible annotation on the
        # run, not a broken update pipeline.  Renovate owns the actual
        # remediation (renaming the ref in flake.nix); this is the
        # backstop for when Renovate is misconfigured, which is how the
        # nixpkgs-kernel case escaped notice.
        #
        # Threshold sizing: the age measured is that of the LOCKED commit,
        # so it grows with our own pull cadence, not just upstream
        # silence.  A weekly-updated input can legitimately reach ~7 days
        # right before its run; nixpkgs-kernel updates monthly, so it can
        # legitimately reach ~31.  Every threshold must therefore exceed
        # its input's update period, plus slack for a skipped run.  Hence
        # 45 for the monthly input and ~2-3x the weekly period for the
        # rest.  A healthy `-small` channel actually moves several times
        # a day, so anything near these numbers is genuinely dead.
        env:
          STALE_MAX_AGE_DAYS: '{"nixpkgs":14,"nixpkgs-stable":21,"nixpkgs-kernel":45,"home-manager-stable":21}'
        run: |
          stale=$(jq -r \
            --argjson t "$STALE_MAX_AGE_DAYS" \
            --argjson now "$(date -u +%s)" '
            .nodes as $n
            | .nodes.root.inputs as $ri
            | $t
            | to_entries[]
            | . as $e
            | ($ri[$e.key] // empty)
            | (if type == "array" then .[-1] else . end) as $node
            | ($n[$node].locked.lastModified // empty) as $lm
            | ((($now - $lm) / 86400) | floor) as $age
            | select($age > $e.value)
            | "\($e.key)|\($age)|\($n[$node].original.ref // "-")|\($e.value)"
          ' flake.lock)

          if [[ -z "$stale" ]]; then
            echo "All tracked channel refs have moved within their expected window."
            exit 0
          fi

          {
            echo "### Stale channel refs"
            echo
            echo "| Input | Ref | Age (days) | Max |"
            echo "| ----- | --- | ---------- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS='|' read -r name age ref max; do
            [[ -z "$name" ]] && continue
            msg="${name} is pinned to '${ref}', which has not moved in"
            msg="${msg} ${age} days (max ${max}). The channel is probably"
            msg="${msg} EOL -- rename the ref in flake.nix."
            echo "::warning title=Stale flake input::${msg}"
            echo "| \`$name\` | \`$ref\` | $age | $max |" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$stale"

          {
            echo
            echo "\`nix flake update\` follows a ref and cannot rename it."
            echo "Bump the channel name in \`flake.nix\` (Renovate should"
            echo "propose this automatically via the \`# renovate:\` annotation)."
          } >> "$GITHUB_STEP_SUMMARY"

  update-flake:
    name: update-flake (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: get-flake-inputs

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-flake-inputs.outputs.flakes) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
          ref: main

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: accept-flake-config = true

      - name: Configure Git identity
        run: |
          git config --global user.email "noreply@github.com"
          git config --global user.name "github[bot]"

      - uses: fredsystems/flake-update-action@76d4f6b1d4d924c9ff073075b685d96474fb87f2 # v3.0.4
        with:
          dependency: ${{ matrix.name }}
          pull-request-token: ${{ secrets.PAT }}
          pull-request-author: github[bot] <noreply@github.com>
          delete-branch: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-branch-prefix: update-
          automerge: ${{ matrix.kind == 'auto' }}
