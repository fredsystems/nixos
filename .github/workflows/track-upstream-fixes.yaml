---
name: track-upstream-fixes

# Watches upstream fixes we are waiting on (see
# .github/tracked-upstream-fixes.json) and flags us, via a GitHub issue, when
# a fix has landed in a way that lets us revert the matching local workaround.
#
# Each tracked entry points at the workaround in this repo and the revert
# action to take. When the checker resolves an entry, this workflow opens (or
# updates) a single sticky issue listing everything that is now ready to
# "unfuck", so the config can be cleaned up.
#
# The sticky issue is fully driven by the checker in BOTH directions: when the
# resolved set becomes empty again -- because every listed workaround has been
# reverted and its manifest entry set `done: true` -- the issue is closed.
# Without that, the issue is only ever written on the way up and silently
# outlives the work it describes, which is what happened to #2161: the single
# fwupd item it listed was reverted in 9d8ab1e4, the next run resolved nothing,
# every step was skipped by the `count != 0` guard, and the issue sat open for
# weeks advertising finished work.

on:
  schedule:
    # Weekly, an hour after the flake auto-update run so any release that just
    # landed in nixpkgs is reflected by the time we look.
    - cron: "0 6 * * 0"
  workflow_dispatch:
  # Re-check whenever the manifest itself changes, so editing the tracker gives
  # immediate feedback.
  #
  # flake.lock is included because the channel-aware check types
  # (`pkgs-min-version`, `nixpkgs-pin-contains-commit`) can only ever change
  # their answer when the pin moves. Without it, an entry becomes revertable
  # the moment an update PR merges but nothing looks until the next Sunday, so
  # the sticky issue lags by up to a week. That is exactly what happened to
  # `nixpkgs-549694-dwarfs-gcc`: dwarfs 0.15.7 landed in the pin on 2026-08-28,
  # after the 08-23 scheduled run, so issue #2161 still listed only the fwupd
  # entry days later.
  push:
    branches: [main]
    paths:
      - .github/tracked-upstream-fixes.json
      - .github/scripts/check-upstream-fixes.sh
      - .github/workflows/track-upstream-fixes.yaml
      - flake.lock

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check tracked upstream fixes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Needed by the `pkgs-min-version` check type, which evaluates the
      # version of a package as it resolves in this repo's pinned nixpkgs.
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: accept-flake-config = true

      - name: Run checker
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          resolved="$(.github/scripts/check-upstream-fixes.sh)"
          # Compact to a single line for the step output.
          echo "resolved=$(jq -c . <<<"$resolved")" >> "$GITHUB_OUTPUT"
          count="$(jq 'length' <<<"$resolved")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Resolved $count tracked fix(es)." >&2

      # Looked up unconditionally: both the open/update path and the close
      # path need the same number, and resolving it once keeps the two
      # branches from drifting apart.
      - name: Find sticky issue
        id: sticky
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          existing="$(gh issue list \
            --repo "$REPO" \
            --state open \
            --search 'in:body "track-upstream-fixes:sticky"' \
            --json number \
            --jq '.[0].number' || true)"
          if [[ "$existing" == "null" ]]; then
            existing=""
          fi
          echo "number=$existing" >> "$GITHUB_OUTPUT"
          echo "Sticky issue: ${existing:-none}" >&2

      - name: Build issue body
        if: steps.check.outputs.count != '0'
        env:
          RESOLVED: ${{ steps.check.outputs.resolved }}
        run: |
          # Build the markdown body into a file. We pass it to the next step
          # via a file (gh --body-file) rather than a step output, which avoids
          # GITHUB_OUTPUT heredoc-delimiter fragility entirely.
          {
            echo "One or more upstream fixes we were waiting on have landed."
            echo "Each item below is ready to have its local workaround reverted."
            echo
            jq -r '.[] |
              "## \(.id)\n\n" +
              "- **What:** \(.summary)\n" +
              "- **Upstream repo:** `\(.repo)`\n" +
              "- **Evidence:** \(.evidence)\n" +
              "- **Tracking:** \((.tracking // []) | join(", "))\n" +
              "- **Workaround location:** \(.workaround)\n" +
              "- **Revert action:** \(.revert_action)\n" +
              "\nAfter reverting, set `\"done\": true` for `\(.id)` in " +
              "`.github/tracked-upstream-fixes.json` (or remove the entry).\n"' \
              <<<"$RESOLVED"
            echo
            echo "<!-- track-upstream-fixes:sticky -->"
          } > "$RUNNER_TEMP/issue-body.md"

      - name: Open or update tracking issue
        if: steps.check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXISTING: ${{ steps.sticky.outputs.number }}
        run: |
          title="Upstream fix(es) landed - revert local workaround(s)"
          body_file="$RUNNER_TEMP/issue-body.md"
          # Idempotent: update the existing sticky issue rather than spamming
          # a new one each run.
          if [[ -n "$EXISTING" ]]; then
            echo "Updating existing tracking issue #$EXISTING" >&2
            gh issue edit "$EXISTING" --repo "$REPO" \
              --title "$title" --body-file "$body_file"
          else
            echo "Opening new tracking issue" >&2
            gh issue create --repo "$REPO" \
              --title "$title" --body-file "$body_file"
          fi

      # The closing half of the sticky-issue lifecycle. Reaching zero resolved
      # entries with an issue still open means every workaround it listed has
      # been reverted, so the issue describes nothing outstanding. Comment
      # before closing so the audit trail says why it closed rather than
      # leaving a bare state change.
      - name: Close tracking issue
        if: >-
          steps.check.outputs.count == '0'
          && steps.sticky.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXISTING: ${{ steps.sticky.outputs.number }}
        run: |
          echo "Closing tracking issue #$EXISTING (nothing left to revert)" >&2
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "Every workaround this issue listed has been reverted and"
            echo "its manifest entry in \`.github/tracked-upstream-fixes.json\`"
            echo "set \`\"done\": true\`, so \`check-upstream-fixes.sh\` now"
            echo "resolves zero entries. Closing automatically."
            echo
            echo "Run: $run_url"
            echo
            echo "A new sticky issue will be opened the next time an upstream"
            echo "fix we are waiting on lands."
          } > "$RUNNER_TEMP/close-comment.md"
          gh issue comment "$EXISTING" --repo "$REPO" \
            --body-file "$RUNNER_TEMP/close-comment.md"
          gh issue close "$EXISTING" --repo "$REPO" --reason completed
