---
name: flake-input-watch

# Hourly: find branch-tracking flake inputs that have moved upstream and
# have no open update PR, classify what bumping each would change (by
# evaluation only, never building; scripts/flake-input-impact.sh), record
# the result in status/flake-inputs.json on the flake-watch branch for
# github-ci-exporter, and dispatch update-flakes.yaml straight away for an
# auto-policy input whose bump changes source rather than only rebuilding.
# See agent-docs/plans/PLAN_03_FLAKE_INPUT_TRACKING.md.
#
# The decisions live in scripts/flake-watch.sh (tested); this file only
# moves data between runners. Darwin is classified on the macOS pool and
# never from Linux (catppuccin's import-from-derivation; see
# scripts/flake-input-impact.sh's header).
#
# Liveness: the exporter's github_workflow_last_success_timestamp_seconds
# for this workflow feeds FlakeWatchStale.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# One run at a time: two publishes racing on the flake-watch branch would
# have one push rejected, and a queued run picks up whatever moved meanwhile.
concurrency:
  group: flake-input-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  find:
    name: Find moved inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
      darwin: ${{ steps.plan.outputs.darwin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p watch
          scripts/flake-watch.sh candidates --lock flake.lock > watch/candidates.json
          scripts/flake-watch.sh resolve-heads --candidates watch/candidates.json > watch/heads.json

          # Inputs with an open update-<input> PR (fredsystems/flake-update-action's branch).
          gh pr list -R "$REPO" --state open --limit 200 --json headRefName \
            --jq '[.[].headRefName | select(startswith("update-")) | ltrimstr("update-")]' \
            > watch/open-prs.json

          # The current status file; {} before the first publish.
          if ! gh api -H "Accept: application/vnd.github.raw" \
            "repos/$REPO/contents/status/flake-inputs.json?ref=flake-watch" \
            > watch/previous.json 2> watch/previous.err; then
            if grep -q "HTTP 404" watch/previous.err; then
              echo '{}' > watch/previous.json
            else
              cat watch/previous.err >&2
              exit 1
            fi
          fi

          scripts/flake-watch.sh plan --heads watch/heads.json \
            --open-prs watch/open-prs.json --previous watch/previous.json > watch/plan.json

          {
            echo "linux=$(jq -c '.classify.linux' watch/plan.json)"
            echo "darwin=$(jq -c '.classify.darwin' watch/plan.json)"
          } >> "$GITHUB_OUTPUT"
          jq -r '"moved: \([.moved[].input] | join(", "))\nclassify (linux): \(.classify.linux | join(", "))\nclassify (darwin): \(.classify.darwin | join(", "))"' watch/plan.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: watch-plan
          path: watch/
          retention-days: 3

  classify-linux:
    name: Classify (Linux)
    needs: find
    if: needs.find.outputs.linux != '[]'
    runs-on: [self-hosted, Linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          trust-runner-user: true
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            accept-flake-config = true

      - name: Classify
        env:
          INPUTS: ${{ needs.find.outputs.linux }}
        run: .github/scripts/flake-watch-classify.sh linux

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: impact-linux
          path: impact-linux.json
          if-no-files-found: ignore
          retention-days: 3

  classify-darwin:
    name: Classify (Darwin)
    needs: find
    if: needs.find.outputs.darwin != '[]'
    runs-on: [self-hosted, macOS]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          trust-runner-user: true
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            accept-flake-config = true
            substituters = http://192.168.31.14:8080/fred https://catppuccin.cachix.org https://cache.nixos.org/
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= fred:JjyhvRSvKfkk8r4HS0mS5r5I7dT4GociEFbrR9OgBZ0= catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU=

      - name: Classify
        env:
          INPUTS: ${{ needs.find.outputs.darwin }}
        run: .github/scripts/flake-watch-classify.sh darwin

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: impact-darwin
          path: impact-darwin.json
          if-no-files-found: ignore
          retention-days: 3

  publish:
    name: Publish status and dispatch
    needs: [find, classify-linux, classify-darwin]
    # Publish whatever was classified, even if one OS's runner was down or an
    # input failed to evaluate: the other results are still true, and an OS
    # with no result is simply asked again next hour (see flake-watch.sh plan).
    if: ${{ always() && needs.find.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts

      - name: Merge
        run: |
          set -euo pipefail
          for os in linux darwin; do
            # No artifact: that OS was skipped, or its runner never got the job.
            f="artifacts/impact-$os/impact-$os.json"
            if [[ -f "$f" ]]; then cp "$f" "impact-$os.json"; else echo '{}' > "impact-$os.json"; fi
          done
          scripts/flake-watch.sh merge \
            --plan artifacts/watch-plan/plan.json \
            --previous artifacts/watch-plan/previous.json \
            --policy .github/flake-input-policy.json \
            --linux impact-linux.json --darwin impact-darwin.json \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > merged.json
          jq -S .status merged.json > flake-inputs.json
          jq -c .dispatch merged.json > dispatch.json
          echo "dispatch: $(cat dispatch.json)"

      - name: Commit to flake-watch (only on change)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: .github/scripts/flake-watch-publish.sh flake-inputs.json

      - name: Dispatch update-flakes for source changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for input in $(jq -r '.[]' dispatch.json); do
            echo "dispatching update-flakes for $input"
            gh workflow run update-flakes.yaml -R "$REPO" --ref main \
              -f target=auto -f single_input="$input"
          done
