---
name: renovate-relock

# When Renovate's customManager bumps a channel ref in flake.nix
# (e.g. nixos-25.11 -> nixos-26.05) it cannot re-resolve flake.lock
# because the hosted bot has no Nix.  This workflow runs `nix flake lock`
# on the PR branch and pushes the re-locked flake.lock back as a
# follow-up commit so the PR merges with flake.nix and flake.lock
# consistent.  Without this the lock stays pinned at the old channel,
# every subsequent `nix build` silently re-resolves the drifted inputs
# against whatever HEAD-of-the-moment exists on the new channel, and
# the repo loses reproducibility until somebody runs `nix flake lock`
# by hand.
#
# When OpenCode or its toolchain moves, verify the node_modules hash
# against this repo's complete lock graph and record it;
# see the opencode-hash job.
#
# NOTE: this workflow intentionally has NO `paths:` filter on the
# trigger. It is configured as a required status check on the default
# branch, and a `paths:` filter would prevent GitHub from instantiating
# the workflow at all for PRs that don't touch flake.nix, leaving the
# required check stuck as "Expected — Waiting for status" forever.
# Cheap no-op behavior is enforced inside the job instead:
#   * the job-level `if:` skips non-renovate PRs (skipped == success),
#   * `git diff --quiet flake.lock` short-circuits when nothing drifted.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Required status checks must also be posted on the merge_group ref
  # that the queue builds, otherwise the queue stalls waiting for a
  # check that is never instantiated.  The job-level `if:` below skips
  # cleanly on merge_group events (no pull_request context), which
  # GitHub records as "Skipped" == passing for branch protection.
  merge_group:

permissions:
  contents: write
  pull-requests: read

jobs:
  relock:
    # Only act on Renovate's PRs.  Skip everything else (incl. our own
    # follow-up push, which is authored by github[bot]) to avoid loops.
    # The same-repo check matters because this checks out the PR head,
    # runs `nix flake lock --refresh` against it, and pushes the result
    # with a write-scoped PAT (not GITHUB_TOKEN -- see below): a
    # same-named fork PR would otherwise get its (attacker-controlled)
    # flake.nix evaluated and re-locked with that PAT.
    if: github.event.pull_request.user.login == 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      opencode: ${{ steps.opencode.outputs.check }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PAT (not GITHUB_TOKEN) so the resulting push re-triggers CI.
          # GITHUB_TOKEN-authored pushes are suppressed from triggering
          # downstream workflows as a recursion guard; a PAT push is
          # treated as a regular human push and re-runs the matrix.
          token: ${{ secrets.PAT }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: true

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            accept-flake-config = true
            access-tokens = github.com=${{ github.token }}

      - name: Test OpenCode relock and hash handling
        run: bash scripts/tests/opencode-node-modules-hash-test.sh

      - name: Re-lock drifted inputs
        id: lock
        # Plain `nix flake lock` only re-resolves inputs whose flake.nix
        # URL no longer matches the lock entry's `original` ref.  It
        # does NOT bump nixpkgs-kernel or any other input where the URL
        # is unchanged.  --refresh forces revalidation of channel HEADs
        # so a same-day re-run picks up upstream movement.
        run: |
          set -euo pipefail
          log="$(mktemp)"
          {
            nix flake lock --refresh
            ./scripts/opencode-node-modules-hash.sh relock
          } 2>&1 | tee "$log"
          if grep -Ei '(^|[[:space:]])(warning|warn|error)(:|[[:space:]])' "$log"; then
            echo "diagnostics=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if lock changed
        id: push
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock already in sync with flake.nix; nothing to do."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.email "noreply@github.com"
          git config user.name "github[bot]"
          git add flake.lock
          git commit -m "chore(flake): relock after renovate flake.nix update"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Fail on every relock warning or error
        # Nix calls a successful lock rewrite a warning too. Still fail this
        # run, after preserving the lock commit: its push triggers a fresh
        # run which must be clean. Actual command errors stop before commit.
        if: steps.lock.outputs.diagnostics == 'true'
        run: |
          echo "::error::Relock emitted a warning or error; this run cannot pass."
          exit 1

      - name: Decide whether to check the opencode node_modules hash
        # Both deployed systems must have hashes for this exact release AND
        # toolchain, including changes that only move opencode/nixpkgs.
        id: opencode
        run: |
          identity="$(./scripts/opencode-node-modules-hash.sh identity)"
          if jq -e --argjson identity "$identity" '
            .nodeModules as $records |
            all(["x86_64-linux", "aarch64-darwin"][];
              $records[.].rev == $identity.rev
              and $records[.].nixpkgsRev == $identity.nixpkgsRev
              and ($records[.].hash | type == "string"))
          ' flake/lib/opencode-node-modules-hashes.json > /dev/null; then
            echo "OpenCode hashes already recorded for this release and toolchain."
            echo "check=false" >> "$GITHUB_OUTPUT"
          else
            echo "OpenCode release or toolchain changed; checking node_modules hashes."
            echo "check=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require verified OpenCode hashes before passing
        if: steps.opencode.outputs.check == 'true'
        run: |
          echo "::error::OpenCode hashes are missing for the locked release/toolchain; the hash jobs must repair them before relock can pass."
          exit 1

  # Upstream ships the opencode node_modules fixed-output hash in
  # nix/hashes.json, and the bot PR that updates it is regularly left
  # unmerged when a release is tagged, which fails every opencode host build.
  # Build upstream's node_modules on each system we deploy and, where its hash
  # is stale, commit the real one to flake/lib/opencode-node-modules-hashes.json
  # (applied by flake/lib/opencode-overlay.nix). This is a standing check on
  # every opencode bump, not a workaround for one upstream PR.
  #
  # Skipped when relock pushed: that push re-runs this workflow against the
  # new lock, and the hash has to be computed for that lock, not this one.
  opencode-hash:
    name: opencode node_modules hash (${{ matrix.system }})
    needs: relock
    # A missing-hash gate deliberately fails relock, but these repair jobs
    # still need to run and push the hashes so the next head can pass.
    if: always() && !cancelled() && needs.relock.outputs.pushed == 'false' && needs.relock.outputs.opencode == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: [self-hosted, Linux]
          - system: aarch64-darwin
            runner: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          trust-runner-user: true
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            accept-flake-config = true
            substituters = http://192.168.31.14:8080/fred https://cache.nixos.org/
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= fred:JjyhvRSvKfkk8r4HS0mS5r5I7dT4GociEFbrR9OgBZ0=

      - name: Compute node_modules hash
        shell: bash
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          nix shell --inputs-from . nixpkgs#jq --command \
            ./scripts/opencode-node-modules-hash.sh compute "$SYSTEM" > "$SYSTEM.hash"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: opencode-hash-${{ matrix.system }}
          path: ${{ matrix.system }}.hash
          retention-days: 1

  opencode-hash-commit:
    name: Commit opencode node_modules hashes
    needs: opencode-hash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PAT so the push re-runs CI against the corrected hash; see relock.
          token: ${{ secrets.PAT }}
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: true

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            accept-flake-config = true
            access-tokens = github.com=${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: opencode-hash-*
          merge-multiple: true
          path: ${{ runner.temp }}/opencode-hashes

      - name: Record hashes, commit and push if any were stale
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HASH_DIR: ${{ runner.temp }}/opencode-hashes
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "PR branch moved past $HEAD_SHA; the run for the new head will handle it."
            exit 0
          fi
          for file in "$HASH_DIR"/*.hash; do
            system="$(basename "$file" .hash)"
            hash="$(<"$file")"
            ./scripts/opencode-node-modules-hash.sh record "$system" "$hash"
          done
          if git diff --quiet flake/lib/opencode-node-modules-hashes.json; then
            echo "Upstream node_modules hashes are correct; nothing to do."
            exit 0
          fi
          version="$(jq -r '.nodes[.nodes.root.inputs.opencode].original.ref' flake.lock)"
          git config user.email "noreply@github.com"
          git config user.name "github[bot]"
          git add flake/lib/opencode-node-modules-hashes.json
          git commit -m "fix(opencode): pin node_modules hashes for ${version%%+*}" \
            -m "Upstream's nix/hashes.json is stale for this release."
          git push
