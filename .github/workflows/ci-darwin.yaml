---
name: CI (Darwin)

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Keyed on the ref so unrelated PRs (and merge-queue entries) never cancel
# each other. cancel-in-progress is true: a superseded push to the same PR
# ref should not keep occupying the scarce self-hosted macOS runners while
# a newer commit is waiting to build.
concurrency:
  group: ci-darwin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # `gh pr view` in the merge-queue-ci-skipper composite action (used by
  # skip-if-clean below) reads the PR for the current ref.
  pull-requests: read

jobs:
  # =====================================================================
  # Fast-path: Detect whether merge_queue introduces zero diff
  # NOTE: MUST ALWAYS RUN, otherwise all dependent jobs skip.
  # =====================================================================
  skip-if-clean:
    name: Skip if merge_queue produces no diff
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Merge Queue CI Check Skipper
        id: merge-queue-ci-skipper
        uses: ./.github/merge-queue-ci-skipper
        with:
          secret: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Check merge_group synthetic commit
        id: check
        run: |
          # PR mode: never skip
          if [ "${{ github.event_name }}" != "merge_group" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ steps.merge-queue-ci-skipper.outputs.skip-check }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  # =====================================================================
  # Discover Darwin systems and detect what changed
  # =====================================================================
  find-darwin:
    name: Find Darwin systems
    # Self-hosted Linux, not ubuntu-latest and not the self-hosted macOS pool:
    # pure `nix eval` of darwinConfigurations doesn't need real macOS hardware
    # (only build-darwin's actual build does; verified directly against
    # x86_64-linux), and a persistent, continuously-warmed self-hosted store
    # makes the real derivation diff dramatically cheaper than ubuntu-latest's
    # cold-every-run store. See the identical, longer comment on find-systems
    # in ci-linux.yaml (measured 9-11 minutes on ubuntu-latest for a single
    # input bump there) and the fork-safety comment on build-darwin below for
    # the `if:` / `permissions:` shape.
    runs-on: [self-hosted, Linux]
    needs: [skip-if-clean]
    if: ${{ needs.skip-if-clean.outputs.skip != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      id-token: "write"
      contents: "read"

    outputs:
      systems: ${{ steps.out.outputs.systems }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          trust-runner-user: true
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            accept-flake-config = true

      # Impact detection lives in one place -- scripts/impacted-hosts.sh --
      # shared verbatim with ci-linux.yaml and the nixos-eval-impacted-hosts
      # skill, instead of three copies of a hand-maintained path classifier.
      # It answers "which host closures actually changed" from a real
      # per-host derivation diff (falling through to that only when it
      # can't answer cheaply and safely; see the script's own header for
      # the four-step algorithm). workflow_dispatch has no base-commit
      # context to diff against, so it keeps its own explicit "build
      # everything" path here rather than being taught to the script.
      - id: out
        shell: bash
        run: |
          set -eo pipefail

          # jq comes from `nix shell`, not the runner -- self-hosted NixOS
          # runners have no jq on PATH. Prepended once so the rest of this
          # step (and impacted-hosts.sh, which inherits this PATH as a child
          # process) can call plain `jq`.
          if ! bin_paths=$(nix build --max-jobs 0 --no-link --print-out-paths --inputs-from . nixpkgs#jq); then
            echo "could not provision jq (not in cache?)" >&2
            exit 1
          fi
          while IFS= read -r p; do
            [ -n "$p" ] && PATH="$p/bin:$PATH"
          done <<<"$bin_paths"
          export PATH

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "workflow_dispatch: building ALL darwin systems (no base commit to diff against)"
            systems_json=$(nix eval --json .#darwinConfigurations --apply builtins.attrNames)
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              base_sha="${{ github.event.pull_request.base.sha }}"
            else
              base_sha="${{ github.event.merge_group.base_sha }}"
            fi

            result=$(./scripts/impacted-hosts.sh --os darwin --json "$base_sha")
            echo "impacted-hosts.sh result: $result"
            systems_json=$(jq -c '.hosts' <<<"$result")
          fi

          echo "systems=$systems_json" >> "$GITHUB_OUTPUT"
          echo "Darwin systems to build: $systems_json"

  # =====================================================================
  # Build Darwin systems (matrix)
  # =====================================================================
  build-darwin:
    name: Build Darwin systems
    runs-on: [self-hosted, macOS]
    needs: [skip-if-clean, find-darwin]
    if: ${{ needs.skip-if-clean.outputs.skip != 'true' && needs.find-darwin.outputs.systems != '[]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      id-token: "write"
      contents: "read"
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJson(needs.find-darwin.outputs.systems) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          trust-runner-user: true
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            accept-flake-config = true
            substituters = http://192.168.31.14:8080/fred https://catppuccin.cachix.org https://cache.nixos.org/
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= fred:JjyhvRSvKfkk8r4HS0mS5r5I7dT4GociEFbrR9OgBZ0= catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU=

      # Magic Nix Cache is NOT used here — multiple self-hosted runners
      # on the same machine fight over port 41239.  We push to Attic
      # explicitly instead.

      - name: Build Darwin system
        shell: bash
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -euo pipefail

          error=0

          echo "Logging in..."
          nix shell --inputs-from . nixpkgs#attic-client --command attic login fred https://attic.int.fredsystems.org "$ATTIC_TOKEN"

          : > build.stderr

          echo "Building Darwin system: ${{ matrix.system }}"
          nix build ".#darwinConfigurations.${{ matrix.system }}.config.system.build.toplevel" 2> >(tee build.stderr >&2)

          if grep -qE "evaluation warning:" build.stderr; then
            error=1
          fi

          echo "Pushing system result..."
          ./scripts/attic-push.sh result

          : > build.stderr
          echo "Building home-manager for: ${{ matrix.system }}"
          nix build ".#darwinConfigurations.${{ matrix.system }}.config.home-manager.users.fred.home.activationPackage" 2> >(tee build.stderr >&2)

          if grep -qE "evaluation warning:" build.stderr; then
            error=1
          fi

          echo "Pushing home-manager result..."
          ./scripts/attic-push.sh result

          if [ "$error" -ne 0 ]; then
            echo "One or more warnings were detected during the build."

            echo "::error::Nix evaluation warnings detected"
            exit 1
          fi

  # =====================================================================
  # Decide whether the dev shell / dev packages need rebuilding (Darwin)
  #
  # Same detection as ci-linux.yaml's find-devshell: the dev shell is fed
  # by flake/dev/*.nix and the inputs nixpkgs, precommit-base, colmena, and
  # walls-*. Unrelated PRs skip the dev-shell build entirely.
  find-devshell:
    name: Detect dev-shell changes
    runs-on: ubuntu-latest
    needs: [skip-if-clean]
    if: ${{ needs.skip-if-clean.outputs.skip != 'true' }}
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect dev-shell-affecting changes
        id: detect
        shell: bash
        run: |
          set -eo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.merge_group.base_sha }}"
          fi

          changed_files=$(git diff --name-only "$base_sha" HEAD)
          echo "Changed files:"
          echo "$changed_files"

          changed=false
          flake_lock_changed=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              flake/dev/*.nix)
                changed=true ;;
              .github/workflows/ci-linux.yaml|.github/workflows/ci-darwin.yaml)
                changed=true ;;
              flake.lock)
                flake_lock_changed=true ;;
            esac
          done <<< "$changed_files"

          devshell_inputs="nixpkgs precommit-base colmena walls-catppuccin walls-zhichaoh walls-cozypixels"

          if [ "$changed" = "false" ] && [ "$flake_lock_changed" = "true" ]; then
            old_lock=$(git show "${base_sha}:flake.lock" 2>/dev/null || echo '{}')
            new_lock=$(cat flake.lock)
            for input in $devshell_inputs; do
              node_name=$(echo "$new_lock" | jq -r ".nodes.root.inputs.\"$input\" // empty")
              [ -z "$node_name" ] && continue
              old_rev=$(echo "$old_lock" | jq -r ".nodes.\"$node_name\".locked.rev // .nodes.\"$node_name\".locked.narHash // empty" 2>/dev/null)
              new_rev=$(echo "$new_lock" | jq -r ".nodes.\"$node_name\".locked.rev // .nodes.\"$node_name\".locked.narHash // empty")
              if [ "$old_rev" != "$new_rev" ]; then
                echo "  dev-shell input changed: $input"
                changed=true
                break
              fi
            done
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "dev-shell rebuild needed: $changed"

  # =====================================================================
  # Build + push the dev shell and dev packages (Darwin)
  #
  # Mirrors the dev-shell job in ci-linux.yaml so the Mac fetches the dev
  # shell (`nix develop`) and per-system packages from Attic instead of
  # rebuilding them locally. Gated on find-devshell so unrelated PRs skip.
  # Caches are listed in extra-conf below; `accept-flake-config = true`
  # there (trusted daemon config) honors the flake's nixConfig without the
  # client-flag rejection. See the ci-linux.yaml dev-shell comment.
  dev-shell-darwin:
    name: Build & push dev shell + packages (Darwin)
    runs-on: [self-hosted, macOS]
    needs: [skip-if-clean, find-devshell]
    if: ${{ needs.skip-if-clean.outputs.skip != 'true' && needs.find-devshell.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      id-token: "write"
      contents: "read"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          trust-runner-user: true
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            accept-flake-config = true
            substituters = http://192.168.31.14:8080/fred https://colmena.cachix.org https://catppuccin.cachix.org https://niri.cachix.org https://niri-epireyn.cachix.org https://cache.nixos.org/
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= fred:JjyhvRSvKfkk8r4HS0mS5r5I7dT4GociEFbrR9OgBZ0= colmena.cachix.org-1:7BzpDnjjH8ki2CT3f6GdOk7QAzPOl+1t3LvTLXqYcSg= catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU= niri.cachix.org-1:Wv0OmO7PsuocRKzfDoJ3mulSl7Z6oezYhGhR+3W2964= niri-epireyn.cachix.org-1:tlVyFN7CtsDT+ZcLPS+ekFWeT1X6X4OqvWqbBMyIzFA=

      - name: Build & push dev shell + packages
        shell: bash
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -euo pipefail

          system=$(nix eval --raw --impure --expr builtins.currentSystem)
          echo "Building dev outputs for system: $system"

          echo "Logging in to Attic..."
          nix shell --inputs-from . nixpkgs#attic-client --command attic login fred https://attic.int.fredsystems.org "$ATTIC_TOKEN"

          echo "Building dev shell..."
          nix build --no-link --print-out-paths \
            ".#devShells.${system}.default" > devshell.paths

          echo "Building dev packages..."
          # Enumerate every packages.<system>.* attr; tolerate an empty set.
          # Emit newline-separated names via Nix itself so this step has no
          # dependency on jq (not present on the self-hosted runner).
          pkg_attrs=$(nix eval --raw ".#packages.${system}" \
            --apply 'ps: builtins.concatStringsSep "\n" (builtins.attrNames ps)')
          while read -r attr; do
            [ -z "$attr" ] && continue
            echo "  building packages.${system}.${attr}"
            nix build --no-link --print-out-paths \
              ".#packages.${system}.${attr}" >> devshell.paths
          done <<< "$pkg_attrs"

          echo "Pushing built dev outputs to Attic..."
          # Push the realised store paths (and their closures) directly.
          # Guarded rather than relying on `xargs -r`: BSD xargs on the
          # darwin runners has historically differed on whether -r is a
          # no-op, and running attic-push.sh with no arguments is a usage
          # error. `-a` is avoided outright -- it is GNU-only and is what
          # broke the darwin dev-shell job ("xargs: invalid option -- a").
          if [ -s devshell.paths ]; then
            xargs ./scripts/attic-push.sh < devshell.paths
          else
            echo "No dev outputs to push."
          fi

  # =====================================================================
  # Required Check Summary
  # =====================================================================
  build-darwin-summary:
    name: Build Darwin Systems Summary
    runs-on: ubuntu-latest
    needs: [skip-if-clean, build-darwin, dev-shell-darwin]
    if: ${{ always() }}

    steps:
      - name: Evaluate results (skip or enforce failures)
        run: |
          # Case 1: merge queue fast-path
          if [ "${{ needs.skip-if-clean.outputs.skip }}" = "true" ]; then
            echo "Merge queue synthetic merge was clean — summary passing without builds."
            exit 0
          fi

          # Case 2: enforce matrix results
          STATUS="${{ needs.build-darwin.result }}"
          DEVSHELL="${{ needs.dev-shell-darwin.result }}"
          echo "build-darwin result:     $STATUS"
          echo "dev-shell-darwin result: $DEVSHELL"

          if [ "$STATUS" = "failure" ] || [ "$DEVSHELL" = "failure" ]; then
            echo "❌ One or more Darwin builds failed."
            exit 1
          fi

          if [ "$STATUS" = "cancelled" ] || [ "$DEVSHELL" = "cancelled" ]; then
            echo "❌ Darwin build was cancelled — treating as failure."
            exit 1
          fi

          echo "✅ All in-scope Darwin systems built successfully (skipped systems were not affected by this PR)."
          exit 0
