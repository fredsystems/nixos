---
name: CI (Linux)

on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Keyed on the ref so unrelated PRs (and merge-queue entries) never cancel
# each other. cancel-in-progress is true: a superseded push to the same PR
# ref should not keep occupying the scarce self-hosted Linux runners while
# a newer commit is waiting to build.
concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # `gh pr view` in the merge-queue-ci-skipper composite action (used by
  # skip-if-clean below) reads the PR for the current ref.
  pull-requests: read

jobs:
  # =====================================================================
  # Fast-path: MUST ALWAYS RUN or downstream jobs will skip
  # =====================================================================
  skip-if-clean:
    name: Skip if merge_queue produces no diff
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Merge Queue CI Check Skipper
        id: merge-queue-ci-skipper
        uses: ./.github/merge-queue-ci-skipper
        with:
          secret: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Check merge_group synthetic commit
        id: check
        run: |
          # PR mode: never skip
          if [ "${{ github.event_name }}" != "merge_group" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ steps.merge-queue-ci-skipper.outputs.skip-check }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  # =====================================================================
  # Discover Linux systems
  # =====================================================================
  find-systems:
    name: Find Linux systems
    # Self-hosted rather than ubuntu-latest: this job's real derivation diff
    # evaluates flake inputs at two revisions (base and HEAD), and an
    # ephemeral ubuntu-latest runner starts every run from a completely cold
    # /nix/store -- any input not already substitutable (in particular the
    # OLD revision of whatever a flake-update PR bumped) has to be fetched
    # from scratch over the network, twice, on top of evaluating ~1000s of
    # derivations across every host on a small shared VM. Measured: 9-11
    # minutes on ubuntu-latest for a single input bump, against
    # colmena-parity (below) doing comparable "evaluate every host" work in
    # ~2 minutes on this same self-hosted pool, whose /nix/store is kept
    # warm by colmena-parity and the build jobs running on every PR against
    # whatever's currently on main -- exactly the revision most "base" diffs
    # need. See the fork-safety comment on colmena-parity for the `if:` and
    # `permissions:` shape; this job carries no fork-supplied secrets either,
    # but excluding forks from self-hosted hardware is the default posture.
    runs-on: [self-hosted, Linux]
    needs: [skip-if-clean]
    if: ${{ needs.skip-if-clean.outputs.skip != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      id-token: "write"
      contents: "read"

    outputs:
      servers: ${{ steps.out.outputs.servers }}
      desktops: ${{ steps.out.outputs.desktops }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          trust-runner-user: true
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            accept-flake-config = true

      # Impact detection lives in one place -- scripts/impacted-hosts.sh --
      # shared verbatim with ci-darwin.yaml and the nixos-eval-impacted-hosts
      # skill, instead of three copies of a hand-maintained path classifier.
      # It answers "which host closures actually changed" from a real
      # per-host derivation diff (falling through to that only when it
      # can't answer cheaply and safely; see the script's own header for
      # the four-step algorithm). workflow_dispatch has no base-commit
      # context to diff against, so it keeps its own explicit "build
      # everything" path here rather than being taught to the script.
      - id: out
        shell: bash
        run: |
          set -eo pipefail

          # jq comes from `nix shell`, not the runner -- see the identical
          # note on colmena-parity: self-hosted NixOS runners have no jq on
          # PATH. Prepended once so the rest of this step (and
          # impacted-hosts.sh, which inherits this PATH as a child process)
          # can call plain `jq`.
          if ! bin_paths=$(nix build --max-jobs 0 --no-link --print-out-paths --inputs-from . nixpkgs#jq); then
            echo "could not provision jq (not in cache?)" >&2
            exit 1
          fi
          while IFS= read -r p; do
            [ -n "$p" ] && PATH="$p/bin:$PATH"
          done <<<"$bin_paths"
          export PATH

          desktop_names=("Daytona" "maranello")

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "workflow_dispatch: building ALL systems (no base commit to diff against)"
            hosts_json=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              base_sha="${{ github.event.pull_request.base.sha }}"
            else
              base_sha="${{ github.event.merge_group.base_sha }}"
            fi

            result=$(./scripts/impacted-hosts.sh --os linux --json "$base_sha")
            echo "impacted-hosts.sh result: $result"
            hosts_json=$(jq -c '.hosts' <<<"$result")
          fi

          echo "Impacted hosts: $hosts_json"

          filtered_servers=()
          filtered_desktops=()
          for sys in $(jq -r '.[]' <<<"$hosts_json"); do
            if [[ " ${desktop_names[*]} " == *" $sys "* ]]; then
              filtered_desktops+=("$sys")
            else
              filtered_servers+=("$sys")
            fi
          done

          # Guard against empty arrays: printf with no args still outputs a
          # newline, which jq turns into [""] instead of [].
          if [ ${#filtered_servers[@]} -eq 0 ]; then
            servers_json="[]"
          else
            servers_json=$(printf '%s\n' "${filtered_servers[@]}" | jq -R . | jq -cs .)
          fi

          if [ ${#filtered_desktops[@]} -eq 0 ]; then
            desktops_json="[]"
          else
            desktops_json=$(printf '%s\n' "${filtered_desktops[@]}" | jq -R . | jq -cs .)
          fi

          echo "servers=$servers_json"   >> "$GITHUB_OUTPUT"
          echo "desktops=$desktops_json" >> "$GITHUB_OUTPUT"

          echo "Servers to build:   $servers_json"
          echo "Desktops to build:  $desktops_json"

  # =====================================================================
  # Build server systems
  # =====================================================================
  build-servers:
    name: Build server systems
    runs-on: [self-hosted, Linux]
    needs: [skip-if-clean, find-systems]
    if: ${{ needs.skip-if-clean.outputs.skip != 'true' && needs.find-systems.outputs.servers != '[]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      id-token: "write"
      contents: "read"
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJson(needs.find-systems.outputs.servers) }}

    steps:
      # - name: Free disk space
      #   run: |
      #     sudo rm -rf /usr/share/dotnet
      #     sudo rm -rf /opt/ghc
      #     sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      #     sudo docker image prune --all --force || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          trust-runner-user: true
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            accept-flake-config = true
            substituters = http://192.168.31.14:8080/fred https://catppuccin.cachix.org https://niri.cachix.org https://niri-epireyn.cachix.org https://cache.nixos.org/
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= fred:JjyhvRSvKfkk8r4HS0mS5r5I7dT4GociEFbrR9OgBZ0= niri.cachix.org-1:Wv0OmO7PsuocRKzfDoJ3mulSl7Z6oezYhGhR+3W2964= niri-epireyn.cachix.org-1:tlVyFN7CtsDT+ZcLPS+ekFWeT1X6X4OqvWqbBMyIzFA= catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU=

      - name: Build server system
        shell: bash
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -euo pipefail

          error=0

          echo "Logging in..."
          nix shell --inputs-from . nixpkgs#attic-client --command attic login fred https://attic.int.fredsystems.org "$ATTIC_TOKEN"

          : > build.stderr

          echo "Building server: ${{ matrix.system }}"
          nix build ".#nixosConfigurations.${{ matrix.system }}.config.system.build.toplevel" 2> >(tee build.stderr >&2)

          if grep -qE "evaluation warning:" build.stderr; then
            error=1
          fi

          echo "Pushing first result..."
          ./scripts/attic-push.sh result

          : > build.stderr
          echo "Building home-manager for: ${{ matrix.system }}"
          nix build ".#nixosConfigurations.${{ matrix.system }}.config.home-manager.users.fred.home.activationPackage" 2> >(tee build.stderr >&2)

          if grep -qE "evaluation warning:" build.stderr; then
            error=1
          fi

          echo "Pushing second result..."
          ./scripts/attic-push.sh result

          if [ "$error" -ne 0 ]; then
            echo "One or more warnings were detected during the build."

            echo "::error::Nix evaluation warnings detected"
            exit 1
          fi
  # =====================================================================
  # Build desktop systems
  # =====================================================================
  build-desktops:
    name: Build desktop systems
    runs-on: [self-hosted, Linux]
    needs: [skip-if-clean, find-systems]
    if: ${{ needs.skip-if-clean.outputs.skip != 'true' && needs.find-systems.outputs.desktops != '[]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      id-token: "write"
      contents: "read"
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJson(needs.find-systems.outputs.desktops) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          trust-runner-user: true
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            accept-flake-config = true
            substituters = http://192.168.31.14:8080/fred https://catppuccin.cachix.org https://niri.cachix.org https://niri-epireyn.cachix.org https://cache.nixos.org/
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= fred:JjyhvRSvKfkk8r4HS0mS5r5I7dT4GociEFbrR9OgBZ0= niri.cachix.org-1:Wv0OmO7PsuocRKzfDoJ3mulSl7Z6oezYhGhR+3W2964= niri-epireyn.cachix.org-1:tlVyFN7CtsDT+ZcLPS+ekFWeT1X6X4OqvWqbBMyIzFA= catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU=

      - name: Build desktop system
        shell: bash
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -euo pipefail

          error=0

          echo "Logging in..."
          nix shell --inputs-from . nixpkgs#attic-client --command attic login fred https://attic.int.fredsystems.org "$ATTIC_TOKEN"

          : > build.stderr

          echo "Building desktop: ${{ matrix.system }}"
          nix build ".#nixosConfigurations.${{ matrix.system }}.config.system.build.toplevel" 2> >(tee build.stderr >&2)

          if grep -qE "evaluation warning:" build.stderr; then
            error=1
          fi

          echo "Pushing first result..."
          ./scripts/attic-push.sh result

          : > build.stderr
          echo "Building home-manager for: ${{ matrix.system }}"
          nix build ".#nixosConfigurations.${{ matrix.system }}.config.home-manager.users.fred.home.activationPackage" 2> >(tee build.stderr >&2)

          if grep -qE "evaluation warning:" build.stderr; then
            error=1
          fi

          echo "Pushing second result..."
          ./scripts/attic-push.sh result

          if [ "$error" -ne 0 ]; then
            echo "One or more warnings were detected during the build."

            echo "::error::Nix evaluation warnings detected"
            exit 1
          fi

  # =====================================================================
  # Decide whether the dev shell / dev packages need rebuilding
  #
  # The dev shell does NOT share the host input set, so the host filter
  # would both over- and under-build it. It is fed by:
  #   - flake/dev/*.nix              (the shell / checks / packages defs)
  #   - input: nixpkgs               (nodejs, typescript, wallpaper pkgs)
  #   - input: precommit-base        (statix/nixfmt/deadnix/... hooks)
  #   - input: colmena               (the colmena CLI in the shell)
  #   - input: walls-{catppuccin,zhichaoh,cozypixels} (wallpaper sources)
  # Anything else (host dirs, server modules, docs) leaves it untouched.
  find-devshell:
    name: Detect dev-shell changes
    runs-on: ubuntu-latest
    needs: [skip-if-clean]
    if: ${{ needs.skip-if-clean.outputs.skip != 'true' }}
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect dev-shell-affecting changes
        id: detect
        shell: bash
        run: |
          set -eo pipefail

          # workflow_dispatch has no diff context — always rebuild.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.merge_group.base_sha }}"
          fi

          changed_files=$(git diff --name-only "$base_sha" HEAD)
          echo "Changed files:"
          echo "$changed_files"

          changed=false
          flake_lock_changed=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              flake/dev/*.nix)
                changed=true ;;
              .github/workflows/ci-linux.yaml|.github/workflows/ci-darwin.yaml)
                changed=true ;;
              flake.lock)
                flake_lock_changed=true ;;
            esac
          done <<< "$changed_files"

          # Inputs that actually feed the dev shell / dev packages.
          devshell_inputs="nixpkgs precommit-base colmena walls-catppuccin walls-zhichaoh walls-cozypixels"

          if [ "$changed" = "false" ] && [ "$flake_lock_changed" = "true" ]; then
            old_lock=$(git show "${base_sha}:flake.lock" 2>/dev/null || echo '{}')
            new_lock=$(cat flake.lock)
            for input in $devshell_inputs; do
              node_name=$(echo "$new_lock" | jq -r ".nodes.root.inputs.\"$input\" // empty")
              [ -z "$node_name" ] && continue
              old_rev=$(echo "$old_lock" | jq -r ".nodes.\"$node_name\".locked.rev // .nodes.\"$node_name\".locked.narHash // empty" 2>/dev/null)
              new_rev=$(echo "$new_lock" | jq -r ".nodes.\"$node_name\".locked.rev // .nodes.\"$node_name\".locked.narHash // empty")
              if [ "$old_rev" != "$new_rev" ]; then
                echo "  dev-shell input changed: $input"
                changed=true
                break
              fi
            done
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "dev-shell rebuild needed: $changed"

  # =====================================================================
  # Build + push the dev shell and dev packages
  #
  # The host build jobs only cache system.build.toplevel and the
  # home-manager activation package. The dev shell (`nix develop`) and the
  # per-system `packages` outputs (colmena CLI, lint tooling, wallpapers)
  # are never part of a host closure, so without this job every machine
  # rebuilds them on first `nix develop`. Build and push them to Attic so
  # all machines (and this Mac) fetch instead of build.
  #
  # Gated on find-devshell so unrelated PRs skip it entirely.
  #
  # The colmena/catppuccin/niri caches are listed explicitly in the
  # installer's extra-conf below (written to /etc/nix/nix.conf as root,
  # i.e. trusted daemon config) so they work regardless of the flake.
  # We do NOT pass the --accept-flake-config *client flag*: the runner
  # build user is not a nix trusted-user, so a client-injected
  # trusted-public-keys would be rejected. Instead extra-conf sets
  # `accept-flake-config = true` as trusted daemon config, which honors
  # the flake's nixConfig without the rejection and silences the
  # "ignoring untrusted flake configuration setting" warning.
  dev-shell:
    name: Build & push dev shell + packages
    runs-on: [self-hosted, Linux]
    needs: [skip-if-clean, find-devshell]
    if: ${{ needs.skip-if-clean.outputs.skip != 'true' && needs.find-devshell.outputs.changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      id-token: "write"
      contents: "read"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          trust-runner-user: true
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            accept-flake-config = true
            substituters = http://192.168.31.14:8080/fred https://colmena.cachix.org https://catppuccin.cachix.org https://niri.cachix.org https://niri-epireyn.cachix.org https://cache.nixos.org/
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= fred:JjyhvRSvKfkk8r4HS0mS5r5I7dT4GociEFbrR9OgBZ0= colmena.cachix.org-1:7BzpDnjjH8ki2CT3f6GdOk7QAzPOl+1t3LvTLXqYcSg= catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU= niri.cachix.org-1:Wv0OmO7PsuocRKzfDoJ3mulSl7Z6oezYhGhR+3W2964= niri-epireyn.cachix.org-1:tlVyFN7CtsDT+ZcLPS+ekFWeT1X6X4OqvWqbBMyIzFA=

      - name: Build & push dev shell + packages
        shell: bash
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -euo pipefail

          system=$(nix eval --raw --impure --expr builtins.currentSystem)
          echo "Building dev outputs for system: $system"

          echo "Logging in to Attic..."
          nix shell --inputs-from . nixpkgs#attic-client --command attic login fred https://attic.int.fredsystems.org "$ATTIC_TOKEN"

          echo "Building dev shell..."
          nix build --no-link --print-out-paths \
            ".#devShells.${system}.default" > devshell.paths

          echo "Building dev packages..."
          # Enumerate every packages.<system>.* attr; tolerate an empty set.
          # Emit newline-separated names via Nix itself so this step has no
          # dependency on jq (not present on the self-hosted runner).
          pkg_attrs=$(nix eval --raw ".#packages.${system}" \
            --apply 'ps: builtins.concatStringsSep "\n" (builtins.attrNames ps)')
          while read -r attr; do
            [ -z "$attr" ] && continue
            echo "  building packages.${system}.${attr}"
            nix build --no-link --print-out-paths \
              ".#packages.${system}.${attr}" >> devshell.paths
          done <<< "$pkg_attrs"

          echo "Pushing built dev outputs to Attic..."
          # Push the realised store paths (and their closures) directly.
          # Guarded rather than relying on `xargs -r`: BSD xargs on the
          # darwin runners has historically differed on whether -r is a
          # no-op, and running attic-push.sh with no arguments is a usage
          # error. `-a` is avoided outright -- it is GNU-only and is what
          # broke the darwin dev-shell job ("xargs: invalid option -- a").
          if [ -s devshell.paths ]; then
            xargs ./scripts/attic-push.sh < devshell.paths
          else
            echo "No dev outputs to push."
          fi

  # =====================================================================
  # Colmena / nixosConfigurations parity
  #
  # flake/deployment/colmena.nix and nixosConfigurations are two
  # independent evaluation paths through the same host modules, and they
  # have actually diverged before: colmena's plain `pkgs.lib` versus the
  # flake-extended `lib` nixosSystem uses produced different
  # `versionSuffix` values, which made the entire server fleet report
  # `unmanaged`. See the comment in flake/deployment/colmena.nix.
  #
  # scripts/gen-fleet-manifest.sh already runs this exact check before
  # every fleet-manifest publish, but that workflow only triggers on push
  # to main and a 6-hour schedule -- a regression can merge with this PR
  # check green and not surface for hours. Running it here closes that
  # gap at review time instead.
  #
  # This needs no BUILD -- colmenaHive is colmena.lib.makeHive, a Nix library
  # function, and .outPath needs no realisation -- but it is not a cheap eval
  # either: it evaluates system.build.toplevel for all 10 hosts plus all 8
  # colmena nodes, i.e. 18 full system closures.
  #
  # It therefore runs on the self-hosted runners, NOT ubuntu-latest. Measured
  # on this PR: 578s on ubuntu-latest, versus 103s for fleet-manifest doing
  # strictly more work (the same two evals plus the manifest history merge and
  # a git push) on self-hosted. The difference is entirely cold flake-input
  # fetch and a cold eval cache; Nix itself installs in 9s. Note that
  # find-systems is NOT a counter-example: it evaluates only
  # `nixosConfigurations --apply builtins.attrNames`, which never forces a
  # single system derivation, and finishes in ~36s.
  #
  # Because it is now on self-hosted, it carries the same fork guard as
  # build-servers/build-desktops/dev-shell: fork PR code must not execute
  # there. Consequence, deliberately accepted -- parity is not checked for
  # fork PRs. That matches the build jobs, which already skip on forks, and a
  # fork PR cannot deploy the fleet. build-linux-summary treats `skipped` as a
  # valid outcome, so this does not break the required check.
  colmena-parity:
    name: Colmena / nixosConfigurations parity
    runs-on: [self-hosted, Linux]
    needs: [skip-if-clean]
    if: ${{ needs.skip-if-clean.outputs.skip != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    # Matches build-servers/build-desktops. id-token is not used by this job,
    # but nix-installer-action warns on every run without it ("FlakeHub is
    # disabled because the workflow is misconfigured"), and this repo treats a
    # noisy CI log as a defect.
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          trust-runner-user: true
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            accept-flake-config = true

      # jq comes from `nix shell`, not the runner: the self-hosted NixOS
      # runners have no jq on PATH (ubuntu-latest does, which is why this only
      # surfaced after moving off it). Same invocation fleet-manifest.yaml uses
      # for gen-fleet-manifest.sh.
      #
      # No --emit-paths: the paths JSON exists only so gen-fleet-manifest.sh
      # can reuse this eval. Emitting it here dumped 10 store paths into the
      # log as one unreadable line.
      - name: Check colmena/nixosConfigurations parity
        shell: bash
        run: |
          nix shell --inputs-from . nixpkgs#jq --command \
            ./scripts/check-colmena-parity.sh

  # =====================================================================
  # `nix store diff-closures` PR comment
  #
  # Audit item 6.2. The concrete motivation: a refactor asserted to be
  # entirely behaviour-preserving merged with all 8 servers byte-identical
  # (correct) but both desktops changed. Finding out *what* changed took a
  # manual investigation across two commits -- comparing `system.path`,
  # `environment.etc` names, `home.file` sources and text hashes by hand --
  # and still did not fully resolve; the delta was somewhere inside the
  # home-manager activation script. This job is the five-second read that
  # investigation should have been: for every host find-systems flagged as
  # impacted, diff its `system.build.toplevel` against the PR base and
  # comment the result.
  #
  # NOT a required check. This is informational only -- see the "must never
  # fail the PR" reasoning below -- and is deliberately NOT part of
  # build-linux-summary's `needs`.
  #
  # WHY self-hosted, NOT ubuntu-latest
  #
  # Two independent reasons, either one sufficient on its own:
  #
  #   1. Reachability. The Attic substituter this job needs to check the
  #      base commit's cached closure lives at http://192.168.31.14:8080/fred
  #      -- a private LAN address. ubuntu-latest cannot reach it at all, so
  #      this job could never usefully run there regardless of cost.
  #   2. Cost class. colmena-parity's header measured 578s on ubuntu-latest
  #      vs 103s on self-hosted for a full closure realisation, entirely due
  #      to a cold eval cache and no LAN cache access. This job's substitute
  #      step (see below) realises store paths the same way; it belongs
  #      wherever build-servers/build-desktops already do.
  #
  # WHY THIS NEVER COSTS A BUILD -- read scripts/diff-closures-comment.sh's
  # header before touching the substitution logic
  #
  # The AFTER closure is free: build-servers/build-desktops already realised
  # it earlier in this same run and pushed it to Attic. The BEFORE closure
  # (the PR base commit) is the one that could be expensive, and the script
  # never pays that cost: it evaluates (never realises) the base commit's
  # outPath via a `git+file://...?rev=<base_sha>` flake ref, and only
  # attempts `nix build --max-jobs 0` (substitute-only; --max-jobs 0 makes a
  # missing path a clean failure, never a real build) if that outPath
  # actually differs from HEAD's.
  #
  # Whether that substitution succeeds depends on whether the base commit's
  # closure is still cached. This repo's merge queue builds every commit
  # that reaches `main`, and Attic retains what it serves for 30 days from
  # last fetch (modules/services/attic/attic_server.nix), so the common
  # case -- a PR based on a recent main commit -- substitutes cleanly. It is
  # NOT guaranteed: a long-lived PR or GC pressure can make the base closure
  # unavailable, and the honest answer in that case is "diff unavailable",
  # not a silent fallback to a real build.
  #
  # NO-CHANGE / FORK-PR HANDLING
  #
  # - Every impacted host unchanged -> the script emits a single "no
  #   closure changes" line rather than an empty table, and the comment
  #   step only UPDATES an existing comment with it (never creates a new
  #   one -- a clean PR should not get a fresh comment just to say so).
  # - Fork PRs get a read-only GITHUB_TOKEN and cannot post comments even
  #   with `pull-requests: write` declared below. The same fork guard every
  #   other self-hosted job in this workflow carries (`if:` below) already
  #   keeps fork PR code off self-hosted runners entirely, so this never
  #   gets far enough to hit that limitation.
  #
  # `always()` is required in `if:` because build-servers/build-desktops use
  # `fail-fast: false`: one matrix leg failing marks the whole job
  # 'failure', and without `always()` this job would be skipped entirely --
  # losing the diff for every host whose build DID succeed. Substitution
  # failing for an unbuilt host is handled per-host inside the script
  # (reported as "unavailable"), not by gating the whole job on build
  # success.
  diff-closures-comment:
    name: Closure diff PR comment
    runs-on: [self-hosted, Linux]
    needs: [skip-if-clean, find-systems, build-servers, build-desktops]
    if: |
      always() &&
      needs.skip-if-clean.outputs.skip != 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.find-systems.outputs.servers != '[]' || needs.find-systems.outputs.desktops != '[]')
    # pull-requests: write is scoped to exactly this job -- nothing else in
    # this workflow posts comments, so the top-level `permissions:` block
    # stays read-only.
    permissions:
      id-token: "write"
      contents: "read"
      pull-requests: "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # fetch-depth: 0 -- the script evaluates the flake AT the PR base
          # commit via `git+file://...?rev=<base_sha>`, which needs that
          # commit's objects present locally, not just HEAD's.
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          trust-runner-user: true
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            accept-flake-config = true
            substituters = http://192.168.31.14:8080/fred https://catppuccin.cachix.org https://niri.cachix.org https://niri-epireyn.cachix.org https://cache.nixos.org/
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= fred:JjyhvRSvKfkk8r4HS0mS5r5I7dT4GociEFbrR9OgBZ0= niri.cachix.org-1:Wv0OmO7PsuocRKzfDoJ3mulSl7Z6oezYhGhR+3W2964= niri-epireyn.cachix.org-1:tlVyFN7CtsDT+ZcLPS+ekFWeT1X6X4OqvWqbBMyIzFA= catppuccin.cachix.org-1:noG/4HkbhJb+lUAdKrph6LaozJvAeEEZj4N732IysmU=

      # jq comes from `nix shell`, not the runner -- see the identical note
      # on the colmena-parity job above.
      - name: Combine impacted hosts
        id: hosts
        shell: bash
        env:
          SERVERS: ${{ needs.find-systems.outputs.servers }}
          DESKTOPS: ${{ needs.find-systems.outputs.desktops }}
        run: |
          set -uo pipefail

          # shellcheck disable=SC2016 # $servers/$desktops are jq --argjson
          # bindings, not shell variables -- they must stay single-quoted.
          #
          # --max-jobs 0: jq must only ever be substituted here, never
          # built locally -- see the cost-model note on this job above.
          hosts_json=$(nix shell --max-jobs 0 --inputs-from . nixpkgs#jq --command jq -cn \
            --argjson servers "$SERVERS" --argjson desktops "$DESKTOPS" \
            '($servers + $desktops) | unique')

          echo "Impacted hosts: $hosts_json"
          echo "hosts_json=$hosts_json" >> "$GITHUB_OUTPUT"

      # This step must never fail the job -- see the header block above.
      # diff-closures-comment.sh already degrades every internal error to
      # STATUS=nothing on stdout; the `status=$(...)` capture here plus the
      # explicit rc/empty check is a second layer in case the script itself
      # cannot even start (e.g. a shell parse error introduced by a future
      # edit), so a bug in the script degrades to "nothing to report"
      # instead of a red required-adjacent job.
      - name: Compute closure diff
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HOSTS_JSON: ${{ steps.hosts.outputs.hosts_json }}
          OUT_FILE: body.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          # --max-jobs 0: jq must only ever be substituted here, never
          # built locally -- see the cost-model note on this job above.
          status="$(nix shell --max-jobs 0 --inputs-from . nixpkgs#jq --command ./scripts/diff-closures-comment.sh)"
          rc=$?

          if [ "$rc" -ne 0 ] || [ -z "$status" ]; then
            echo "diff-closures-comment.sh exited abnormally (rc=$rc) -- treating as nothing to report"
            status="STATUS=nothing"
            : > body.md
          fi

          echo "$status" >> "$GITHUB_OUTPUT"

      # Find-then-edit-or-create, the same shape cve-scan.yaml's "Find or
      # update CVE report issue" step uses for its rolling issue -- adapted
      # here to a PR comment instead of an issue. The marker HTML comment at
      # the top of body.md (written by the script) is what "find" searches
      # for, so repeated pushes to the same PR update one comment instead of
      # stacking a new one every run.
      #
      # gh/jq are added to PATH via `nix build --print-out-paths` rather
      # than wrapping every call in `nix shell --command` -- both packages
      # are common enough to substitute from cache.nixos.org in a couple of
      # seconds, and prepending their `bin` dirs once keeps the rest of this
      # step readable as plain `gh`/`jq` calls instead of deeply nested
      # quoting.
      #
      # No `-e` and an explicit `exit 0` at the end: this step must never
      # fail the job, per the "must never fail the PR" requirement -- a
      # transient GitHub API error here is logged, not propagated.
      - name: Find or update PR comment
        if: steps.diff.outputs.STATUS != 'nothing'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STATUS: ${{ steps.diff.outputs.STATUS }}
        run: |
          set -uo pipefail

          # --max-jobs 0: gh/jq must only ever be substituted here, never
          # built locally -- see the cost-model note on this job above. A
          # cache miss now fails this provisioning step cleanly instead
          # of silently paying for a local build of either package.
          if ! bin_paths=$(nix build --max-jobs 0 --no-link --print-out-paths --inputs-from . nixpkgs#gh nixpkgs#jq); then
            echo "could not provision gh/jq (not in cache?) -- skipping PR comment" >&2
            exit 0
          fi
          while IFS= read -r p; do
            [ -n "$p" ] && PATH="$p/bin:$PATH"
          done <<<"$bin_paths"
          export PATH

          marker='<!-- diff-closures-report -->'

          # A failed lookup (not "found no match", but the `gh api` call
          # itself erroring -- rate limit, transient API failure) must
          # not fall through to the changed-status path below: with
          # existing_id left empty, that path would then CREATE a new
          # comment even though one may already exist, duplicating the
          # report every time this step's API call happens to fail.
          existing_id_err=$(mktemp)
          if ! existing_id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '[.[] | select(.body | startswith("'"$marker"'"))] | (first.id // empty)' \
            2>"$existing_id_err"); then
            echo "could not look up existing PR comment -- skipping to avoid posting a duplicate:" >&2
            sed 's/^/  /' "$existing_id_err" >&2
            rm -f "$existing_id_err"
            exit 0
          fi
          rm -f "$existing_id_err"

          if [ "$STATUS" = "unchanged" ]; then
            if [ -n "$existing_id" ]; then
              echo "No closure changes -- updating existing comment #${existing_id}."
              gh api --method PATCH "repos/${REPO}/issues/comments/${existing_id}" -f body=@body.md >/dev/null
            else
              echo "No closure changes and no existing comment -- nothing to do."
            fi
            exit 0
          fi

          if [ -n "$existing_id" ]; then
            echo "Updating existing comment #${existing_id}."
            gh api --method PATCH "repos/${REPO}/issues/comments/${existing_id}" -f body=@body.md >/dev/null
          else
            echo "Creating new PR comment."
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file body.md >/dev/null
          fi

          exit 0

  # =====================================================================
  # Required summary check
  # =====================================================================
  build-linux-summary:
    name: Build Linux Summary
    runs-on: ubuntu-latest
    needs:
      [skip-if-clean, build-servers, build-desktops, dev-shell, colmena-parity]
    if: ${{ always() }}

    steps:
      - name: Evaluate summary (skip or propagate failures)
        run: |
          # merge_queue fast-path
          if [ "${{ needs.skip-if-clean.outputs.skip }}" = "true" ]; then
            echo "Merge queue synthetic merge was clean — summary passing without builds."
            exit 0
          fi

          SERVERS="${{ needs.build-servers.result }}"
          DESKTOPS="${{ needs.build-desktops.result }}"
          DEVSHELL="${{ needs.dev-shell.result }}"
          PARITY="${{ needs.colmena-parity.result }}"

          echo "Servers result:        $SERVERS"
          echo "Desktops result:       $DESKTOPS"
          echo "Dev shell result:      $DEVSHELL"
          echo "Colmena parity result: $PARITY"

          # A result of "skipped" means the matrix was empty (no systems in
          # scope for this PR) — that is a valid outcome, not a failure.
          # colmena-parity has no system-count gate, but it does carry a fork
          # guard (it runs on self-hosted), so "skipped" there means either
          # the skip-if-clean fast-path already handled above, or a fork PR.
          # Both are valid; only failure/cancelled are treated as fatal.
          if [ "$SERVERS" = "failure" ] || [ "$DESKTOPS" = "failure" ] || [ "$DEVSHELL" = "failure" ] || [ "$PARITY" = "failure" ]; then
            echo "❌ One or more Linux builds failed."
            exit 1
          fi

          if [ "$SERVERS" = "cancelled" ] || [ "$DESKTOPS" = "cancelled" ] || [ "$DEVSHELL" = "cancelled" ] || [ "$PARITY" = "cancelled" ]; then
            echo "❌ Build job was cancelled — treating as failure."
            exit 1
          fi

          echo "✅ All in-scope Linux systems built successfully (skipped systems were not affected by this PR)."
          exit 0
