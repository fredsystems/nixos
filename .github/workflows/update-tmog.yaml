---
name: update-tmog

# Keeps overlays/tmog.json pinned to the latest Task Manager TMOG Linux
# release. TMOG is closed source and not in nixpkgs, and nothing else --
# Renovate included -- watches upstream's release manifest
# (https://www.tmog.org/downloads/release-linux.json).
#
# Runs at :55 rather than on the hour. GitHub documents the top of the hour
# as its highest-contention slot for scheduled workflows and drops queued
# jobs under load.

on:
  schedule:
    - cron: "55 4 * * *"
  workflow_dispatch:

# Static group name: the daily cron and a manual dispatch open/update the
# same PR branch. cancel-in-progress must stay false so a cancelled run
# cannot leave a pushed branch with no PR attached.
concurrency:
  group: update-tmog
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-tmog:
    name: Update TMOG pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PAT (not GITHUB_TOKEN) so the pushed branch triggers CI on the
          # resulting PR -- see the same note in renovate-relock.yaml.
          token: ${{ secrets.PAT }}
          persist-credentials: true

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: accept-flake-config = true

      - name: Configure Git identity
        run: |
          git config --global user.email "noreply@github.com"
          git config --global user.name "github[bot]"

      - name: Re-pin to the latest upstream release
        id: update
        run: |
          set -uo pipefail

          # `run:` blocks execute under `bash -e`, and update-tmog.sh exits 2
          # to mean "changed, not an error". The invocation must BE the `if`
          # condition so -e does not abort before the case below translates
          # it. See the same note in update-syncclipboard.yaml.
          if nix shell nixpkgs#jq nixpkgs#curl -c ./scripts/update-tmog.sh; then
            rc=0
          else
            rc=$?
          fi

          # 0 = already current, 2 = pin was updated, anything else = error.
          case "$rc" in
            0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changed=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "update failed with exit $rc" >&2; exit "$rc" ;;
          esac

          echo "version=$(jq -r .version overlays/tmog.json)" >> "$GITHUB_OUTPUT"

      - name: Verify the package builds
        if: steps.update.outputs.changed == 'true'
        # Proves the hash and that the tarball layout and Qt linkage still
        # match overlays/tmog.nix (autoPatchelf fails the build on a missing
        # library). tmog is unfree; Daytona's pkgs already allows it via the
        # desktop tmog feature.
        run: nix build '.#nixosConfigurations.Daytona.pkgs.tmog' --no-link

      - name: Commit, push, and open a PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          NEW_VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -euo pipefail

          branch="update-tmog-${NEW_VERSION}"

          # Ask "have I already filed this?", not "does a branch exist?".
          # Any PR for this branch (open, closed, or merged) means the
          # workflow has done its job or a human has ruled on the bump, so a
          # deliberately closed PR is not reopened daily. See the longer
          # note in update-syncclipboard.yaml.
          existing="$(gh pr list --head "$branch" --state all --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "PR #${existing} already exists for $branch; nothing to do"
            exit 0
          fi

          git checkout -b "$branch"
          git add overlays/tmog.json
          git commit -m "chore(tmog): update to ${NEW_VERSION}"

          # --force is reachable only when no PR exists for this branch, so
          # there is nothing under review to clobber.
          git push --force -u origin "$branch"

          gh pr create \
            --title "chore(tmog): update to ${NEW_VERSION}" \
            --body "$(cat <<BODY
          Automated bump of the Task Manager TMOG pin to upstream ${NEW_VERSION}.

          The version came from https://www.tmog.org/downloads/release-linux.json.
          The tarball hash was proven by
          \`nix build .#nixosConfigurations.Daytona.pkgs.tmog\`.

          Release notes: https://www.tmog.org/release-notes.html

          Opened automatically by \`.github/workflows/update-tmog.yaml\`.
          BODY
          )" \
            --label dependencies
